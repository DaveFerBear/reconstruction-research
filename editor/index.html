<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spec Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cabin:wght@400;700&family=Crimson+Text:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Indie+Flower&family=Lato:wght@400;700&family=Lobster&family=Merriweather:wght@400;700&family=Montserrat:wght@100;400;700;900&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=PT+Sans:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@100;400;700;900&family=Raleway:wght@400;700&family=Righteous&family=Roboto:wght@400;700&family=Source+Sans+Pro:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <h2>Design Specs</h2>
        <div id="spec-list"></div>
    </div>
    <div id="preview">
        <div id="error"></div>
        <div id="comparison-container">
            <div id="original-container">
                <h3>Original</h3>
                <div id="original-image"></div>
            </div>
            <div id="reconstruction-container">
                <h3>Reconstruction</h3>
                <div id="canvas-container"></div>
            </div>
        </div>
    </div>
    <div id="properties" class="hidden">
        <h2>Properties</h2>
        <div id="properties-content"></div>
    </div>

    <div id="controls">
        <button id="copy-btn" disabled>Copy Spec</button>
        <button id="save-btn" disabled>Save Spec</button>
    </div>

    <script type="module" src="editor.js"></script>
</body>
</html>
