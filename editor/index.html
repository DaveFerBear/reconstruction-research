<body>
    <div id="sidebar">
        <h2>Design Specs</h2>
        <div id="spec-list"></div>
    </div>
    <div id="preview">
        <div id="error"></div>
        <div id="comparison-container">
            <div id="original-container">
                <h3>Original</h3>
                <div id="original-image"></div>
            </div>
            <div id="reconstruction-container">
                <h3>Reconstruction</h3>
                <div id="canvas-container"></div>
            </div>
        </div>
    </div>
    <div id="properties" class="hidden">
        <h2>Properties</h2>
        <div id="properties-content"></div>
    </div>

    <div id="controls">
        <button id="add-svg-btn" disabled>+ Add SVG</button>
        <button id="copy-btn" disabled>Copy Spec</button>
        <button id="save-btn" disabled>Save Spec</button>
    </div>

    <script type="module" src="editor.js"></script>
</body>
</html>
