<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spec Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alegreya&family=Alfa+Slab+One&family=Alumni+Sans+Collegiate+One&family=Amatic+SC&family=Anton&family=Antonio&family=Archivo+Narrow&family=Arimo&family=Asap&family=Barlow+Condensed:wght@400;700&family=Barriecito&family=Bebas+Neue&family=Berkshire+Swash&family=Bungee&family=Cabin+Sketch&family=Charis+SIL&family=Codystar&family=Comic+Relief&family=Courier+Prime&family=Creepster&family=Crimson+Text&family=DM+Sans&family=Dancing+Script&family=Domine&family=Eater&family=Exo&family=Figtree&family=Frijole&family=Glass+Antiqua&family=Grand+Hotel&family=Great+Vibes&family=Homemade+Apple&family=IBM+Plex+Mono&family=Imbue&family=Inconsolata&family=Indie+Flower&family=Instrument+Serif&family=Inter&family=Inter+Tight&family=Jacquard+12&family=Jacquard+24&family=Josefin+Sans&family=Kranky&family=Lacquer&family=Lato&family=League+Gothic&family=League+Spartan&family=Leckerli+One&family=Lemon&family=Lemonada&family=Libre+Baskerville&family=Libre+Franklin&family=Limelight&family=Lobster&family=Londrina+Shadow&family=Lora&family=Luckiest+Guy&family=Manrope&family=Matemasie&family=Merriweather&family=Metal+Mania&family=Monoton&family=Montserrat&family=Mountains+of+Christmas&family=Noto+Sans&family=Oi&family=Open+Sans&family=Orbitron&family=Oswald&family=PT+Serif&family=Pacifico&family=Parkinsans&family=Pattaya&family=Permanent+Marker&family=Plaster&family=Playfair+Display&family=Pompiere&family=Poppins&family=Quicksand&family=Racing+Sans+One&family=Raleway&family=Roboto&family=Roboto+Condensed:wght@400;700&family=Roboto+Slab&family=Rye&family=STIX+Two+Text&family=Sacramento&family=Sansita+Swashed&family=Satisfy&family=Shrikhand&family=Tiny5&family=Unbounded&family=Underdog&display=swap" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <h2>Design Specs</h2>
        <div id="spec-list"></div>
    </div>
    <div id="preview">
        <div id="error"></div>
        <div id="comparison-container">
            <div id="original-container">
                <h3>Original</h3>
                <div id="original-image"></div>
            </div>
            <div id="reconstruction-container">
                <h3>Reconstruction</h3>
                <div id="canvas-container"></div>
            </div>
        </div>
    </div>
    <div id="properties" class="hidden">
        <h2>Properties</h2>
        <div id="properties-content"></div>
    </div>

    <div id="controls">
        <button id="add-svg-btn" disabled>+ Add SVG</button>
        <button id="copy-btn" disabled>Copy Spec</button>
        <button id="save-btn" disabled>Save Spec</button>
    </div>

    <script type="module" src="editor.js"></script>
</body>
</html>
