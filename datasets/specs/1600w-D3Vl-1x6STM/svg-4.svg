<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main lightning bolt shape: white fill, black outline -->
  <polygon
    points="50,0 70,0 95,30 60,25 90,60 50,55 80,100 60,100"
    fill="#ffffff"
    stroke="#1f1f1f"
    stroke-width="2"
  />
  <!-- Accent stroke along the right edge of the bolt -->
  <path
    d="M 70 0 L 95 30 L 90 60 L 80 100"
    fill="none"
    stroke="#c95543"
    stroke-width="3"
  />
</svg>