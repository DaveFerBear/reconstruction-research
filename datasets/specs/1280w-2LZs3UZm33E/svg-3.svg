<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- The main thin, soft shadow ellipse (the blurred, semi-transparent part) -->
  <ellipse cx="50" cy="85" rx="22" ry="5" fill="rgba(0,0,0,0.2)" filter="url(#soft-blur)"/>

  <!-- The medium warm gray-brown stroke ellipse (unblurred, on top, defining a subtle edge) -->
  <ellipse cx="50" cy="85" rx="21" ry="4.5" fill="none" stroke="#CFC3AF" stroke-width="0.5"/>
</svg>