<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#1f3f9a" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- Platter Outer Oval -->
    <path d="M 50 15 Q 75 15 75 50 Q 75 85 50 85 Q 25 85 25 50 Q 25 15 50 15 Z"/>
    <!-- Platter Inner Oval -->
    <path d="M 50 20 Q 68 20 68 50 Q 68 80 50 80 Q 32 80 32 50 Q 32 20 50 20 Z"/>
  </g>

  <!-- Inner ring of evenly spaced dots -->
  <g fill="#1f3f9a">
    <circle cx="50" cy="25" r="1.5"/>
    <circle cx="62" cy="30" r="1.5"/>
    <circle cx="67" cy="45" r="1.5"/>
    <circle cx="62" cy="70" r="1.5"/>
    <circle cx="50" cy="75" r="1.5"/>
    <circle cx="38" cy="70" r="1.5"/>
    <circle cx="33" cy="45" r="1.5"/>
    <circle cx="38" cy="30" r="1.5"/>
  </g>

  <!-- Sketchy Lobster -->
  <g stroke="#1f3f9a" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- Head -->
    <path d="M 50 35 C 45 30 55 30 50 35"/>
    <!-- Body -->
    <path d="M 50 35 C 40 40 40 50 50 55 C 60 50 60 40 50 35 Z"/>
    <!-- Tail Segments -->
    <path d="M 50 55 C 45 60 55 60 50 65"/>
    <path d="M 50 65 C 45 70 55 70 50 75"/>
    <path d="M 50 75 C 45 80 55 80 50 85"/>
    <!-- Tail Fan -->
    <path d="M 50 85 L 45 90 M 50 85 L 55 90 M 50 85 L 47 92 M 50 85 L 53 92"/>
    <!-- Left Claw Arm -->
    <path d="M 45 40 C 30 30 25 20 30 15"/>
    <!-- Left Claw Pincer -->
    <path d="M 30 15 L 25 10 M 30 15 L 35 10"/>
    <!-- Right Claw Arm -->
    <path d="M 55 40 C 70 30 75 20 70 15"/>
    <!-- Right Claw Pincer -->
    <path d="M 70 15 L 65 10 M 70 15 L 75 10"/>
    <!-- Antennae -->
    <path d="M 48 32 L 40 22 M 52 32 L 60 22"/>
    <!-- Legs -->
    <path d="M 45 45 L 35 50 M 45 50 L 35 55 M 55 45 L 65 50 M 55 50 L 65 55"/>
  </g>

  <!-- White Highlight Streaks -->
  <g stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- Claw Highlights -->
    <path d="M 32 17 L 28 13"/>
    <path d="M 68 17 L 72 13"/>
    <!-- Tail Highlights -->
    <path d="M 48 67 L 46 69"/>
    <path d="M 52 67 L 54 69"/>
    <path d="M 48 77 L 46 79"/>
    <path d="M 52 77 L 54 79"/>
    <path d="M 48 87 L 46 89"/>
    <path d="M 52 87 L 54 89"/>
  </g>
</svg>