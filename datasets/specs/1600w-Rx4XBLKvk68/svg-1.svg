<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Common styles -->
  <defs>
    <style>
      .globe-stroke { stroke:#6fa66a; stroke-width:3; fill:none; }
      .globe-fill   { fill:#6fa66a; }
    </style>
  </defs>

  <!-- Left filled globe -->
  <g transform="translate(10,10)">
    <circle cx="20" cy="20" r="20" class="globe-stroke globe-fill" />
    <!-- latitude lines -->
    <line x1="0"  y1="20" x2="40" y2="20" class="globe-stroke" />
    <ellipse cx="20" cy="20" rx="20" ry="10" class="globe-stroke" />
    <!-- longitude lines -->
    <ellipse cx="20" cy="20" rx="8"  ry="20" class="globe-stroke" />
    <ellipse cx="20" cy="20" rx="3"  ry="20" class="globe-stroke" />
  </g>

  <!-- Right outline globe -->
  <g transform="translate(50,10)">
    <circle cx="20" cy="20" r="20" class="globe-stroke" />
    <!-- latitude lines -->
    <line x1="0"  y1="20" x2="40" y2="20" class="globe-stroke" />
    <ellipse cx="20" cy="20" rx="20" ry="10" class="globe-stroke" />
    <!-- longitude lines -->
    <ellipse cx="20" cy="20" rx="8"  ry="20" class="globe-stroke" />
    <ellipse cx="20" cy="20" rx="3"  ry="20" class="globe-stroke" />
  </g>
</svg>
