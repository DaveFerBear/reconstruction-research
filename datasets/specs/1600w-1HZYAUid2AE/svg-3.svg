<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 90">
  <defs>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="0" in="SourceAlpha" result="offset-alpha"/>
      <feGaussianBlur stdDeviation="5" in="offset-alpha" result="blur"/>
      <feComposite operator="out" in="SourceAlpha" in2="blur" result="shadow-mask"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.2" result="flood"/>
      <feComposite operator="in" in="flood" in2="shadow-mask" result="shadow"/>
      <feComposite operator="over" in="SourceGraphic" in2="shadow"/>
    </filter>
  </defs>

  <!-- Main Bar -->
  <rect x="0" y="0" width="1920" height="90" rx="22" ry="22" fill="#2b1848" opacity="0.85" filter="url(#innerShadow)"/>

  <!-- Vertical Separator Lines -->
  <line x1="640" y1="20" x2="640" y2="70" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="990" y1="20" x2="990" y2="70" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Phone Icon -->
  <g transform="translate(50, 45)">
    <circle cx="0" cy="0" r="27" fill="#3a2a60"/>
    <path d="M-10.5 -12.5 L-10.5 12.5 C-10.5 13.6 -9.6 14.5 -8.5 14.5 L8.5 14.5 C9.6 14.5 10.5 13.6 10.5 12.5 L10.5 -12.5 C10.5 -13.6 9.6 -14.5 8.5 -14.5 L-8.5 -14.5 C-9.6 -14.5 -10.5 -13.6 -10.5 -12.5 Z" 
          fill="#ffffff" transform="rotate(-45) scale(0.8)"/>
  </g>
</svg>