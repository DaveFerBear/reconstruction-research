<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 20" width="300" height="20" role="img" aria-label="Progress bar">
  <style>
    :root { --pct: 86; } /* fill percent adjusted to match your image */
  </style>

  <!-- Outer blue track -->
  <rect x="0" y="0" width="300" height="20" rx="10" ry="10" fill="#2351f0"/>

  <!-- Inner background -->
  <rect x="3" y="3" width="294" height="14" rx="7" ry="7" fill="#f1f5ff"/>

  <!-- Filled portion (86%) -->
  <!-- 294 * 0.86 = 252.84 -->
  <g id="fill-group">
    <rect x="3" y="3" width="252.84" height="14" rx="7" ry="7" fill="#1f2be8"/>
    
  </g>
</svg>
