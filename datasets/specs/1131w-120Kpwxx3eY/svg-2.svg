<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Decorative royal-blue squiggle stroke (hand-drawn wave) -->
  <path d="M 20 30 C 30 10 50 10 60 30 S 90 50 100 30 S 130 10 140 30 S 170 50 180 30"
        fill="none" stroke="#4169E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Minimal sunburst icon -->
  <g transform="translate(140 45)">
    <!-- Semicircle (top half, flat base at y=15) -->
    <path d="M 0 15 A 15 15 0 0 0 30 15 Z" fill="#FFD700"/>
    
    <!-- Short radial bars -->
    <line x1="15" y1="0" x2="15" y2="-5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" transform="rotate(-60 15 15)"/>
    <line x1="15" y1="0" x2="15" y2="-5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" transform="rotate(-30 15 15)"/>
    <line x1="15" y1="0" x2="15" y2="-5" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="0" x2="15" y2="-5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" transform="rotate(30 15 15)"/>
    <line x1="15" y1="0" x2="15" y2="-5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" transform="rotate(60 15 15)"/>
  </g>
</svg>