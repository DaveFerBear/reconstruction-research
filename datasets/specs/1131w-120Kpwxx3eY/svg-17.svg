<!-- Progress bar SVG (editable percent via --pct in the <style>) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 139 20" width="150" height="20" role="img" aria-label="Progress bar">
  <style>
    /* Set percentage here (0 - 100). Default: 72% */
    :root { --pct: 72; }
    /* calculated inner width = (totalInnerWidth) * (pct/100) */
    /* total inner width = outerWidth - 6 (3px padding each side) = 133 */
  </style>

  <!-- Outer track -->
  <rect x="0" y="0" width="139" height="20" rx="10" ry="10" fill="#2351f0"/>

  <!-- Inner (background) track to show padding / inset -->
  <rect x="3" y="3" width="133" height="14" rx="7" ry="7" fill="#f1f5ff"/>

  <!-- Filled portion: width and handle position computed for default 72% -->
  <!-- For static SVG you can replace the width and cx values based on percent. -->
  <!-- Here I use values for 72%: innerWidth = 133 * 0.72 = 95.76 -->
  <g id="fill-group">
    <rect x="3" y="3" width="95.76" height="14" rx="7" ry="7" fill="#1f2be8"/>
    <!-- handle / knob -->
    <circle cx="98.76" cy="10" r="6.8" fill="#ffffff" opacity="0.22" />
    <circle cx="98.76" cy="10" r="4.8" fill="#6f9eff"/>
  </g>
</svg>
