<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-image: url('background.png'); background-size: cover; background-position: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <img src="asset-1.png" style="position: absolute; left: 310px; top: 120px; width: 980px; height: 1460px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Photorealistic front view of a modern black smartphone (iPhone-style) centered on the canvas. It has a slim black bezel, rounded corners, and a wide top notch with a small camera/earpiece opening. The screen content is white, and the device casts a soft shadow on the pink background." /><div style="position: absolute; left: 730px; top: 330px; width: 140px; height: 110px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 24 24" fill="none" stroke="#3f5361" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Envelope body and flap -->
  <path d="M2 6h20v12H2z M2 6l10 6 10-6"/>
  <!-- Notification bell -->
  <path d="M20 3c0-1-2-1-2 0 M18 3v2h4v-2 M17.5 5h5 M20 5.5v.5"/>
</svg></div><div style="position: absolute; left: 160px; top: 760px; width: 1280px; height: 520px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="black" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- White rounded rectangle card with subtle drop shadow -->
  <rect x="10" y="10" width="300" height="200" rx="44" fill="white" filter="url(#drop-shadow)"/>

  <!-- Thin horizontal divider line in pale pink -->
  <line x1="10" y1="170" x2="310" y2="170" stroke="#efd9dc" stroke-width="1"/>

  <!-- Thin vertical line splitting the bottom area into two equal buttons -->
  <line x1="160" y1="170" x2="160" y2="210" stroke="#efd9dc" stroke-width="1"/>
</svg></div><div style="position: absolute; left: 160px; top: 820px; width: 1280px; height: 80px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 56px; color: #3f5361; text-align: center; font-weight: 700; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">REMINDER</div></div><div style="position: absolute; left: 160px; top: 900px; width: 1280px; height: 130px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 38px; color: #6d7b86; text-align: center; font-weight: 400; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Your productivity doesn’t define you.</div></div><div style="position: absolute; left: 160px; top: 1100px; width: 640px; height: 120px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 44px; color: #3f5361; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Yes</div></div><div style="position: absolute; left: 800px; top: 1100px; width: 640px; height: 120px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 44px; color: #3f5361; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">No</div></div>
    </div>
</body>
</html>
