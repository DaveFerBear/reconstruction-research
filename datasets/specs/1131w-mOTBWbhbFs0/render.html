<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1131px;
            height: 1600px;
            background-color: #0b3d2e;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 110px; width: 1131px; height: 170px; transform: rotate(0deg); opacity: 1; font-family: Pacifico; font-size: 150px; color: #e8dbc8; text-align: center; font-weight: normal; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Coffee</div></div><div style="position: absolute; left: 0px; top: 300px; width: 1131px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Cooper Black; font-size: 240px; color: #e8dbc8; text-align: center; font-weight: 900; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">TO GO</div></div><div style="position: absolute; left: 306px; top: 610px; width: 520px; height: 520px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" stroke="#E0D2C0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Coffee Cup Group -->
  <!-- Cup bottom center at (150, 100), rotated 30 degrees around this point -->
  <g transform="rotate(30 150 100)">
    <!-- Cup Body -->
    <path d="M125 100 L130 40 A20 5 0 0 1 170 40 L175 100 Z"/>
    <!-- Bands -->
    <line x1="127" y1="75" x2="173" y2="75"/>
    <line x1="128" y1="55" x2="172" y2="55"/>
    <!-- Lid -->
    <path d="M125 40 Q150 20 175 40 L170 35 Q150 15 130 35 Z"/>
    <path d="M130 35 L135 30 Q150 10 165 30 L170 35 Z"/>
  </g>

  <!-- People Group -->
  <!-- Each person's group origin (0,0) is their head center.
       Arms reach up to y=15 relative to their group origin.
       The people's y-positions are adjusted to align their hands with the tilted cup.
  -->

  <!-- Person 1 (Left) -->
  <g transform="translate(115 72.5)">
    <circle cx="0" cy="0" r="8"/> <!-- Head -->
    <path d="M0 8 L0 50"/> <!-- Body -->
    <path d="M-10 30 L-5 15 L5 15 L10 30"/> <!-- Arms raised -->
    <path d="M-5 50 L-10 70 M5 50 L10 70"/> <!-- Legs -->
  </g>

  <!-- Person 2 (Middle) -->
  <g transform="translate(150 85)">
    <circle cx="0" cy="0" r="8"/> <!-- Head -->
    <path d="M0 8 L0 50"/> <!-- Body -->
    <path d="M-10 30 L-5 15 L5 15 L10 30"/> <!-- Arms raised -->
    <path d="M-5 50 L-10 70 M5 50 L10 70"/> <!-- Legs -->
  </g>

  <!-- Person 3 (Right) -->
  <g transform="translate(185 97.5)">
    <circle cx="0" cy="0" r="8"/> <!-- Head -->
    <path d="M0 8 L0 50"/> <!-- Body -->
    <path d="M-10 30 L-5 15 L5 15 L10 30"/> <!-- Arms raised -->
    <path d="M-5 50 L-10 70 M5 50 L10 70"/> <!-- Legs -->
  </g>
</svg></div><div style="position: absolute; left: 0px; top: 1260px; width: 1131px; height: 70px; transform: rotate(0deg); opacity: 1; font-family: Futura; font-size: 56px; color: #e8dbc8; text-align: center; font-weight: 300; font-style: normal; text-decoration: none; text-transform: uppercase; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">MON-FRI 07:00-20:30</div></div><div style="position: absolute; left: 0px; top: 1370px; width: 1131px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Futura; font-size: 40px; color: #e8dbc8; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: uppercase; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">123 ANYWHERE ST., ANY CITY</div></div>
    </div>
</body>
</html>
