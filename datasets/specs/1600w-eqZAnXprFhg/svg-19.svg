<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Central Rounded Rectangle -->
  <rect x="300" y="200" width="200" height="100" rx="15" ry="15" stroke="black" stroke-width="2" fill="none" />

  <!-- Colored Squares -->
  <rect x="100" y="50" width="80" height="80" fill="red" stroke="black" stroke-width="1" />
  <rect x="620" y="50" width="80" height="80" fill="blue" stroke="black" stroke-width="1" />
  <rect x="100" y="470" width="80" height="80" fill="green" stroke="black" stroke-width="1" />
  <rect x="620" y="470" width="80" height="80" fill="yellow" stroke="black" stroke-width="1" />
  <rect x="360" y="50" width="80" height="80" fill="purple" stroke="black" stroke-width="1" />
  <rect x="360" y="470" width="80" height="80" fill="orange" stroke="black" stroke-width="1" />

  <!-- Connector Lines with Arrowheads -->
  <!-- Line to Top-Left (Red) -->
  <line x1="350" y1="200" x2="180" y2="90" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <!-- Line to Top-Right (Blue) -->
  <line x1="450" y1="200" x2="620" y2="90" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <!-- Line to Bottom-Left (Green) -->
  <line x1="350" y1="300" x2="180" y2="510" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <!-- Line to Bottom-Right (Yellow) -->
  <line x1="450" y1="300" x2="620" y2="510" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <!-- Line to Top-Center (Purple) -->
  <line x1="380" y1="200" x2="400" y2="130" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <!-- Line to Bottom-Center (Orange) -->
  <line x1="420" y1="300" x2="400" y2="470" stroke="black" stroke-width="2.5" marker-end="url(#arrowhead)" />
</svg>