</svg></div><img src="asset-1.png" style="position: absolute; left: 970px; top: 670px; width: 500px; height: 500px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Portrait photo of a smiling young woman with shoulder-length brown hair, neutral beige background; subject facing camera, wearing a sleeveless light top. Image is circularly masked to fit within the orange ring." /><div style="position: absolute; left: 1430px; top: 590px; width: 150px; height: 150px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="circleGradient" cx="75%" cy="75%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </radialGradient>

    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Erode the alpha channel slightly to create a smaller inner shape -->
      <feMorphology in="SourceAlpha" operator="erode" radius="1" result="erodedAlpha"/>
      <!-- Blur this eroded alpha -->
      <feGaussianBlur in="erodedAlpha" stdDeviation="2" result="innerBlur"/>
      <!-- Create a solid color for the glow (white with transparency) -->
      <feFlood flood-color="#FFFFFF" flood-opacity="0.6" result="glowColor"/>
      <!-- Composite the glow color with the inner blur, keeping only the part that overlaps -->
      <feComposite in="glowColor" in2="innerBlur" operator="in" result="coloredInnerBlur"/>
      <!-- Merge the original graphic with the colored inner blur -->
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="coloredInnerBlur"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="40" fill="url(#circleGradient)" filter="url(#innerGlow)"/>
</svg></div><div style="position: absolute; left: 1180px; top: 120px; width: 260px; height: 64px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
