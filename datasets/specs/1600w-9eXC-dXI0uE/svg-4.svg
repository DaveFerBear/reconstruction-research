      cx="103" cy="53" rx="80" ry="30"
      fill="none"
      stroke="#000000"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Primary stroke: #7c3aed, 7px -->
