<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1341px;
            background-color: #0b72b5;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 90px; top: 100px; width: 1400px; height: 945px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70">
  <rect x="5" y="5" width="90" height="50" fill="white"/>
  <polygon points="15,55 25,55 20,65" fill="white"/>
</svg></div><div style="position: absolute; left: 1110px; top: 210px; width: 230px; height: 210px; transform: rotate(0deg); opacity: 1; "><svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define a single lightning bolt path. It's roughly 20 units wide and 80 units tall. -->
    <path id="lightningBolt" d="M 10 0 L 0 40 L 8 40 L 0 80 L 10 80 L 20 40 L 12 40 L 20 0 Z" />
  </defs>

  <!-- Large, central lightning bolt -->
  <!-- Scaled to 0.75 (15w x 60h), rotated 5 degrees around its center (7.5, 30), then translated to position -->
  <use href="#lightningBolt" fill="black" transform="translate(42.5 20) rotate(5 7.5 30) scale(0.75)" />

  <!-- Smaller left lightning bolt -->
  <!-- Scaled to 0.5 (10w x 40h), then translated to position -->
  <use href="#lightningBolt" fill="black" transform="translate(20 30) scale(0.5)" />

  <!-- Smaller right lightning bolt -->
  <!-- Scaled to 0.5 (10w x 40h), then translated to position -->
  <use href="#lightningBolt" fill="black" transform="translate(70 30) scale(0.5)" />
</svg></div><div style="position: absolute; left: 180px; top: 80px; width: 520px; height: 200px; transform: rotate(6deg); opacity: 1; "><svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid yellow rectangle banner, slightly rotated clockwise -->
  <rect x="50" y="70" width="500" height="60" fill="#FFD700" transform="rotate(3 300 100)" />

  <!-- 'NEWS' text -->
  <text x="300" y="115" font-family="Arial, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="black">
    NEWS
  </text>
</svg></div><div style="position: absolute; left: 150px; top: 260px; width: 680px; height: 200px; transform: rotate(-6deg); opacity: 1; "><svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow banner for context and overlap -->
  <rect x="0" y="0" width="400" height="100" fill="yellow"/>

  <!-- Solid red rectangle banner, slightly rotated counter-clockwise -->
  <rect x="50" y="20" width="300" height="60" fill="red" transform="rotate(-5 200 50)"/>

  <!-- Text 'UPDATE', positioned on the red banner and rotated with it -->
  <text x="200" y="50" font-family="sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(-5 200 50)">UPDATE</text>
</svg></div><div style="position: absolute; left: 205px; top: 100px; width: 480px; height: 170px; transform: rotate(6deg); opacity: 1; font-family: Impact; font-size: 170px; color: #000000; text-align: left; font-weight: 900; font-style: normal; text-decoration: none; text-transform: uppercase; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">NEWS</div></div><div style="position: absolute; left: 178px; top: 278px; width: 620px; height: 170px; transform: rotate(-6deg); opacity: 1; font-family: Impact; font-size: 170px; color: #ffffff; text-align: left; font-weight: 900; font-style: normal; text-decoration: none; text-transform: uppercase; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">UPDATE</div></div><div style="position: absolute; left: 210px; top: 620px; width: 980px; height: 250px; transform: rotate(0deg); opacity: 1; font-family: Arial; font-size: 84px; color: #000000; text-align: left; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">See our update on our earlier story.</div></div><div style="position: absolute; left: 1115px; top: 895px; width: 420px; height: 330px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow Sleeve -->
  <path d="M 90 155 L 80 165 L 70 150 L 75 130 L 95 135 Z" fill="#ffc107"/>

  <!-- Black Cuff -->
  <path d="M 120 150 L 110 160 L 90 155 L 95 135 L 125 135 Z" fill="black"/>

  <!-- Black Buttons on Cuff -->
  <circle cx="105" cy="150" r="3" fill="black"/>
  <circle cx="95" cy="145" r="3" fill="black"/>

  <!-- Red Megaphone Body -->
  <path d="M 180 160 L 190 140 L 110 60 L 100 80 Z" fill="#d32f2f"/>

  <!-- Yellow Megaphone Handle (under the hand) -->
  <path d="M 150 130 Q 140 150 160 160 L 170 140 Q 160 120 150 130 Z" fill="#ffc107"/>

  <!-- Light Gray Hand (holding the handle) -->
  <path d="M 155 155 C 145 170 125 165 120 150 C 125 135 145 140 155 155 Z" fill="#e6e6e6"/>

  <!-- Yellow Megaphone Rim -->
  <path d="M 180 160 L 190 140 L 185 135 L 175 155 Z" fill="#ffc107"/>

  <!-- Gray Cone Interior Edge -->
  <path d="M 170 150 L 180 130" stroke="#808080" stroke-width="2" fill="none"/>

  <!-- Red Megaphone Back Cap -->
  <circle cx="105" cy="70" r="5" fill="#d32f2f"/>
</svg></div>
    </div>
</body>
</html>
