<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow banner for context and overlap -->
  <rect x="0" y="0" width="400" height="100" fill="yellow"/>

  <!-- Solid red rectangle banner, slightly rotated counter-clockwise -->
  <rect x="50" y="20" width="300" height="60" fill="red" transform="rotate(-5 200 50)"/>

  <!-- Text 'UPDATE', positioned on the red banner and rotated with it -->
  <text x="200" y="50" font-family="sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(-5 200 50)">UPDATE</text>
</svg>