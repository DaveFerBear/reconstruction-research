<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200">
  <g fill="#111111" fill-rule="evenodd">
    <!-- Letter 'e' -->
    <path d="
      M 60,100                                                              <!-- Start bottom left of stem -->
      C 55,100 50,95 50,90 L 50,30 C 50,25 55,20 60,20                      <!-- Left stem, rounded ends -->
      C 70,20 80,25 85,35                                                   <!-- Thin top curve -->
      C 90,40 95,45 100,45 C 105,45 110,50 105,55                           <!-- Top teardrop peak -->
      C 100,60 95,60 90,55                                                  <!-- End of top teardrop -->
      C 85,50 80,45 75,45                                                   <!-- Back to main curve -->
      C 85,55 95,65 100,75                                                  <!-- Thick right side curve -->
      C 105,85 105,90 100,95 C 95,100 90,100 85,95                          <!-- Bottom teardrop peak -->
      C 80,90 75,90 70,85                                                   <!-- End of bottom teardrop -->
      C 65,80 60,70 60,60                                                   <!-- Back to main stem -->
      L 60,100 Z                                                            <!-- Close outer path -->

      M 70,50                                                               <!-- Start inner hole -->
      C 75,45 80,45 85,50                                                   <!-- Inner top curve -->
      C 90,55 90,60 85,65                                                   <!-- Inner right curve -->
      C 80,70 75,70 70,65                                                   <!-- Inner bottom curve -->
      C 65,60 65,55 70,50 Z                                                 <!-- Close inner hole -->
    "/>

    <!-- Letter 'g' and sweeping swash -->
    <path d="
      M 170,20                                                              <!-- Start top left of 'g' bowl -->
      C 165,20 160,25 160,30 L 160,90                                       <!-- Left stem of bowl -->
      C 160,95 165,100 170,100                                              <!-- Bottom left of bowl -->
      C 180,100 190,95 195,85                                               <!-- Bottom curve of bowl -->
      C 200,80 205,75 210,75                                                <!-- Connection point to descender -->
      C 215,75 220,70 215,65                                                <!-- Teardrop at connection -->
      C 210,60 205,60 200,65                                                <!-- End of teardrop -->
      C 195,70 190,75 185,75                                                <!-- Back to curve -->
      C 195,65 205,55 210,45                                                <!-- Thick right curve of bowl -->
      C 215,35 215,30 210,25 C 205,20 200,20 195,25                         <!-- Top teardrop of bowl -->
      C 190,30 185,30 180,25                                                <!-- End of top teardrop -->
      C 175,20 170,20 170,20                                                <!-- Back to top left of bowl -->

      M 210,75                                                              <!-- Start of descender from bowl -->
      C 205,100 190,120 170,130                                             <!-- Descender outer curve down -->
      C 150,140 130,150 100,150                                             <!-- Descender outer curve left -->
      C 70,150 40,160 10,170                                                <!-- Swash outer curve left and down -->
      C -20,180 -20,190 10,190                                              <!-- Round terminal of swash -->
      C 40,190 70,180 100,170                                               <!-- Swash inner curve right and up -->
      C 130,160 150,150 170,140                                             <!-- Descender inner curve right and up -->
      C 190,130 205,110 210,85                                              <!-- Back to descender connection -->
      L 210,75 Z                                                            <!-- Close descender and swash -->

      M 180,50                                                              <!-- Inner bowl hole -->
      C 185,45 190,45 195,50 C 200,55 200,60 195,65 C 190,70 185,70 180,65 C 175,60 175,55 180,50 Z

      M 170,130                                                             <!-- Inner descender loop hole -->
      C 165,125 165,120 170,115 C 175,110 180,110 185,115 C 190,120 190,125 185,130 C 180,135 175,135 170,130 Z
    "/>

    <!-- Letter 'o' -->
    <path d="
      M 300,100                                                             <!-- Start bottom left of 'o' -->
      C 295,100 290,95 290,90 L 290,30 C 290,25 295,20 300,20               <!-- Left side, rounded ends -->
      C 310,20 320,25 325,35                                                <!-- Top curve -->
      C 330,40 335,45 340,45 C 345,45 350,50 345,55                         <!-- Top teardrop peak -->
      C 340,60 335,60 330,55                                                <!-- End of top teardrop -->
      C 325,50 320,45 315,45                                                <!-- Back to main curve -->
      C 325,55 335,65 340,75                                                <!-- Thick right side curve -->
      C 345,85 345,90 340,95 C 335,100 330,100 325,95                       <!-- Bottom teardrop peak -->
      C 320,90 315,90 310,85                                                <!-- End of bottom teardrop -->
      C 305,80 300,70 300,60                                                <!-- Back to main stem -->
      L 300,100 Z                                                           <!-- Close outer path -->

      M 310,50                                                              <!-- Inner hole -->
      C 315,45 320,45 325,50 C 330,55 330,60 325,65 C 320,70 315,70 310,65 C 305,60 305,55 310,50 Z
    "/>

    <!-- Small teardrop above 'g' stem -->
    <path d="
      M 180,10                                                              <!-- Top point -->
      C 175,15 175,20 180,25                                                <!-- Left curve -->
      C 185,30 190,30 195,25                                                <!-- Bottom curve -->
      C 200,20 200,15 195,10                                                <!-- Right curve -->
      C 190,5 185,5 180,10 Z                                                <!-- Close shape -->
    "/>
  </g>
</svg>