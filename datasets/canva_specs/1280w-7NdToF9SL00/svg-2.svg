<svg viewBox="0 0 200 150">
  <defs>
    <!-- Define one irregular, hand-drawn spike path -->
    <path id="starburst-spike" d="M 0 0 L 10 3 L 20 -2 L 30 5"
          stroke="black" stroke-width="6" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- First hand-drawn black starburst with eight irregular spikes -->
  <g transform="translate(50, 75)">
    <use href="#starburst-spike" transform="rotate(0)"/>
    <use href="#starburst-spike" transform="rotate(45)"/>
    <use href="#starburst-spike" transform="rotate(90)"/>
    <use href="#starburst-spike" transform="rotate(135)"/>
    <use href="#starburst-spike" transform="rotate(180)"/>
    <use href="#starburst-spike" transform="rotate(225)"/>
    <use href="#starburst-spike" transform="rotate(270)"/>
    <use href="#starburst-spike" transform="rotate(315)"/>
  </g>

  <!-- Mirrored counterpart on the upper-right -->
  <!-- The scale(-0.6, 0.6) transforms it:
       - Scales it down to 60% of its original size.
       - Flips it horizontally (due to -0.6 in x-scale), creating the "mirrored" effect for each spike.
       - The translate(150, 40) positions the center of this transformed starburst.
  -->
  <g transform="translate(150, 40) scale(-0.6, 0.6)">
    <use href="#starburst-spike" transform="rotate(0)"/>
    <use href="#starburst-spike" transform="rotate(45)"/>
    <use href="#starburst-spike" transform="rotate(90)"/>
    <use href="#starburst-spike" transform="rotate(135)"/>
    <use href="#starburst-spike" transform="rotate(180)"/>
    <use href="#starburst-spike" transform="rotate(225)"/>
    <use href="#starburst-spike" transform="rotate(270)"/>
    <use href="#starburst-spike" transform="rotate(315)"/>
  </g>
</svg>