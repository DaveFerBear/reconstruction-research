<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Turntable Deck -->
  <rect x="50" y="150" width="400" height="150" rx="15" ry="15"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Feet -->
  <rect x="80" y="300" width="30" height="20" rx="5" ry="5"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="390" y="300" width="30" height="20" rx="5" ry="5"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knobs (solid black with thick black stroke) -->
  <circle cx="100" cy="270" r="10"
          stroke="#222222" stroke-width="8" fill="#222222"/>
  <circle cx="130" cy="270" r="10"
          stroke="#222222" stroke-width="8" fill="#222222"/>
  <circle cx="160" cy="270" r="10"
          stroke="#222222" stroke-width="8" fill="#222222"/>

  <!-- Record -->
  <circle cx="220" cy="220" r="60"
          stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Record Center (solid black with thick black stroke) -->
  <circle cx="220" cy="220" r="15"
          stroke="#222222" stroke-width="8" fill="#222222"/>

  <!-- Smiling Face on Record -->
  <!-- Eyes (solid black, no stroke as they are small filled dots) -->
  <circle cx="205" cy="210" r="4" fill="#222222"/>
  <circle cx="235" cy="210" r="4" fill="#222222"/>
  <!-- Mouth (thinner stroke for detail) -->
  <path d="M205 230 Q220 245 235 230"
        stroke="#222222" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tonearm and Cartridge -->
  <path d="M300 170 C320 180 280 210 260 220"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cartridge (simple rectangle) -->
  <rect x="250" y="210" width="20" height="15" rx="3" ry="3"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cheering Hands/Arms -->
  <!-- Left Arm/Hand -->
  <path d="M150 150 L130 100 Q140 70 170 60 Q200 50 210 80 L190 120"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm/Hand -->
  <path d="M350 150 L370 100 Q360 70 330 60 Q300 50 290 80 L310 120"
        stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>