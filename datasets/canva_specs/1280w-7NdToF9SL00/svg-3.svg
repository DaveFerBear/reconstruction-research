<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#222222" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Turntable Deck -->
    <rect x="30" y="70" width="140" height="60" rx="10" ry="10"/>

    <!-- Feet -->
    <rect x="45" y="130" width="15" height="10" rx="3" ry="3"/>
    <rect x="140" y="130" width="15" height="10" rx="3" ry="3"/>

    <!-- Knobs (filled) -->
    <circle cx="55" cy="90" r="4" fill="#222222"/>
    <circle cx="70" cy="90" r="4" fill="#222222"/>
    <circle cx="85" cy="90" r="4" fill="#222222"/>

    <!-- Record -->
    <circle cx="125" cy="100" r="35"/>
    <!-- Record Center (filled) -->
    <circle cx="125" cy="100" r="8" fill="#222222"/>

    <!-- Smiling Face on Record -->
    <circle cx="118" cy="95" r="2"/> <!-- Left Eye -->
    <circle cx="132" cy="95" r="2"/> <!-- Right Eye -->
    <path d="M118 105 Q125 109 132 105"/> <!-- Smile -->

    <!-- Tonearm and Cartridge -->
    <rect x="150" y="75" width="10" height="15" rx="3" ry="3"/> <!-- Tonearm Base -->
    <path d="M155 85 L135 95"/> <!-- Tonearm -->
    <rect x="130" y="92" width="8" height="6" rx="2" ry="2"/> <!-- Cartridge -->

    <!-- Cheering Hands/Arms -->
    <!-- Left Arm -->
    <path d="M60 60 Q50 40 70 30"/>
    <!-- Left Hand -->
    <circle cx="70" cy="25" r="8"/>

    <!-- Right Arm -->
    <path d="M140 60 Q150 40 130 30"/>
    <!-- Right Hand -->
    <circle cx="130" cy="25" r="8"/>
  </g>
</svg>