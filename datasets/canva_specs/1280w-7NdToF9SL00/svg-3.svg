<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#222222" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Turntable Deck: rectangular with rounded corners -->
    <rect x="50" y="100" width="300" height="150" rx="15" ry="15"/>

    <!-- Two short feet beneath the deck -->
    <rect x="80" y="250" width="20" height="15"/>
    <rect x="300" y="250" width="20" height="15"/>

    <!-- Three small circular knobs at the front-left -->
    <!-- Knob 1 -->
    <circle cx="90" cy="130" r="10"/>
    <circle cx="90" cy="130" r="4" fill="#222222"/>
    <!-- Knob 2 -->
    <circle cx="120" cy="130" r="10"/>
    <circle cx="120" cy="130" r="4" fill="#222222"/>
    <!-- Knob 3 -->
    <circle cx="150" cy="130" r="10"/>
    <circle cx="150" cy="130" r="4" fill="#222222"/>

    <!-- Circular record -->
    <circle cx="270" cy="175" r="60"/> <!-- Outer record -->
    <circle cx="270" cy="175" r="30"/> <!-- Inner label area -->
    <circle cx="270" cy="175" r="5" fill="#222222"/> <!-- Spindle hole (solid black area) -->

    <!-- Smiling face drawn in the center of the record -->
    <!-- Eyes (solid black areas) -->
    <circle cx="260" cy="165" r="3" fill="#222222"/>
    <circle cx="280" cy="165" r="3" fill="#222222"/>
    <!-- Mouth (stroke) -->
    <path d="M 260 185 Q 270 195 280 185" stroke-width="4"/>

    <!-- Cartridge at top-right over a circular record -->
    <!-- Tonearm -->
    <path d="M 320 120 Q 290 130 275 165" />
    <!-- Cartridge head -->
    <rect x="265" y="158" width="15" height="10" transform="rotate(-15 272.5 163)" />

    <!-- Two raised cartoon hands/arms appear above the turntable as if cheering -->
    <!-- Left Arm -->
    <path d="M 100 80 Q 120 40 140 60"/>
    <!-- Left Hand -->
    <path d="M 135 55 Q 145 35 165 50 C 170 55 165 65 155 70 Q 145 75 135 55 Z"/>

    <!-- Right Arm -->
    <path d="M 300 80 Q 280 40 260 60"/>
    <!-- Right Hand -->
    <path d="M 265 55 Q 255 35 235 50 C 230 55 235 65 245 70 Q 255 75 265 55 Z"/>

  </g>
</svg>