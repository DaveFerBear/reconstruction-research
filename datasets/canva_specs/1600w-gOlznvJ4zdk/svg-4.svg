<svg width="100%" height="100%" viewBox="0 0 750 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Polka dot pattern: small white circles on a #A9C7A7 background -->
    <pattern id="polkaDotPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" fill="#A9C7A7"/>
      <circle cx="5" cy="5" r="1.5" fill="white"/>
    </pattern>
  </defs>

  <!-- Numeral 1: Left column top -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">1</text>

  <!-- Numeral 2: Below Numeral 1 -->
  <text x="80" y="380" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">2</text>

  <!-- Numeral 3: Right column top -->
  <text x="480" y="180" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">3</text>

  <!-- Brush-like underline sweep under Step 3 (below Numeral 3) -->
  <path d="M430 280 Q600 310 770 280" stroke="#8EA993" stroke-width="30" stroke-linecap="round" fill="none"/>
</svg>