<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #DBE7D1;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 0px; width: 1600px; height: 1600px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="gridPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="160" height="160" fill="#DBE7D1"/>
      <line x1="0" y1="0" x2="160" y2="0" stroke="#C9D7C1" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#C9D7C1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#gridPattern)"/>
</svg></div><div style="position: absolute; left: 200px; top: 140px; width: 1200px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Arial Rounded MT Bold; font-size: 120px; color: #2B4E43; text-align: center; font-weight: bold; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Self-Care Jar</div></div><div style="position: absolute; left: 120px; top: 200px; width: 1360px; height: 320px; transform: rotate(0deg); opacity: 1; "><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .doodle-stroke {
        stroke: #FFFFFF;
        stroke-width: 6px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Open-outline heart doodle (approx 200x250px, tilted 10° clockwise) -->
  <g transform="translate(650, 200) rotate(10) scale(5)">
    <path class="doodle-stroke" d="M -20 -5 C -20 -15, -10 -25, 0 -25 C 10 -25, 20 -15, 20 -5 C 20 5, 0 15, 0 25 C 0 15, -20 5, -20 -5"/>
  </g>

  <!-- Three short accent dashes doodle (each ~30-50px, radiating slightly upward) -->
  <g transform="translate(150, 250)">
    <line class="doodle-stroke" x1="0" y1="0" x2="-20" y2="-30"/>
    <line class="doodle-stroke" x1="20" y1="0" x2="20" y2="-40"/>
    <line class="doodle-stroke" x1="40" y1="0" x2="60" y2="-30"/>
  </g>
</svg></div><div style="position: absolute; left: 96px; top: 1040px; width: 1408px; height: 480px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="200" rx="24" fill="#FFFFFF" stroke="none"/>
</svg></div><img src="asset-1.png" style="position: absolute; left: 520px; top: 520px; width: 560px; height: 560px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Center illustration of a hand-drawn glass jar with thick dark green outline (#2B4E43). The jar body is white with a few interior accent strokes (#2B4E43). The metal lid is a flattened oval top in warm amber (#F0BD63) with dark green rim lines. Inside the jar are four puffy hearts with a sticker-like white border: two red hearts (#D4433F) and two golden hearts (#F4C069) arranged diagonally. Beneath the jar sits a wide elliptical shadow/placemat in muted sage green (#8EA993) with a darker rim (#6E8C78), centered under the jar and overlapping the top of the white panel slightly." /><div style="position: absolute; left: 140px; top: 1060px; width: 1320px; height: 420px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 650 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="polkaDotPattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect x="0" y="0" width="10" height="10" fill="#A9C7A7"/>
      <circle cx="5" cy="5" r="2" fill="white"/>
    </pattern>
  </defs>

  <!-- Numeral 1 -->
  <path
    d="M 30 0 L 30 10 C 30 15, 25 15, 25 20 L 25 100 C 25 105, 20 105, 20 110 L 0 110 L 0 120 L 60 120 L 60 110 L 40 110 C 35 105, 35 100, 35 95 L 35 20 C 35 15, 30 15, 30 10 Z"
    transform="translate(80, 80)"
    fill="url(#polkaDotPattern)"
    stroke="#2B4E43"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Numeral 2 -->
  <path
    d="M 10 40 C 10 10, 30 -10, 60 0 C 90 10, 90 40, 70 60 L 40 90 L 10 120 L 90 120 L 90 100 L 30 100 L 60 70 L 90 40 C 90 20, 70 0, 60 0 C 50 0, 30 10, 30 30 Z"
    transform="translate(80, 250)"
    fill="url(#polkaDotPattern)"
    stroke="#2B4E43"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Numeral 3 -->
  <path
    d="M 20 10 C 20 -5, 40 -5, 50 10 C 60 25, 50 35, 40 35 C 30 35, 20 45, 20 55 C 20 65, 30 75, 40 75 C 50 75, 60 65, 70 80 C 80 95, 50 105, 20 95 L 20 75 L 40 75 C 50 75, 60 65, 60 55 C 60 45, 50 35, 40 35 C 30 35, 20 25, 20 15 Z"
    transform="translate(480, 80)"
    fill="url(#polkaDotPattern)"
    stroke="#2B4E43"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Underline -->
  <path
    d="M 100 480 C 200 500, 350 460, 460 480"
    fill="none"
    stroke="#8EA993"
    stroke-width="18"
    stroke-linecap="round"
  />
</svg></div><div style="position: absolute; left: 330px; top: 1070px; width: 520px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Get an empty jar</div></div><div style="position: absolute; left: 330px; top: 1200px; width: 520px; height: 180px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Write down your favorite self-care ideas on strips of paper.</div></div><div style="position: absolute; left: 1020px; top: 1070px; width: 480px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Whenever you're feeling down, stressed out, or drained – pull out a strip of paper and then do that activity.</div></div>
    </div>

</html>
