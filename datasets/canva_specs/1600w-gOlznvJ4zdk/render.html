<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #DBE7D1;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 0px; width: 1600px; height: 1600px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 0 0 V 160 M 0 0 H 160" stroke="#C9D7C1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#DBE7D1"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
</svg></div><div style="position: absolute; left: 200px; top: 140px; width: 1200px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Arial Rounded MT Bold; font-size: 120px; color: #2B4E43; text-align: center; font-weight: bold; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Self-Care Jar</div></div><div style="position: absolute; left: 120px; top: 200px; width: 1360px; height: 320px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Open-outline heart, 200x240px, tilted 10° clockwise, positioned at right -->
  <path
    d="M 100 240 C 100 200, 200 100, 200 60 C 200 20, 160 0, 100 0 C 40 0, 0 20, 0 60 C 0 100, 100 200, 100 240"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    transform="translate(250 30) rotate(10 100 120)"
  />
  <!-- Three short accent dashes, radiating slightly upward, positioned at left -->
  <line x1="100" y1="150" x2="70" y2="120" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="150" x2="100" y2="110" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="150" x2="130" y2="120" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
</svg></div><div style="position: absolute; left: 96px; top: 1040px; width: 1408px; height: 480px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect x="0" y="0" width="200" height="100" rx="24" ry="24" fill="#FFFFFF" stroke="none"/>
</svg></div><img src="asset-1.png" style="position: absolute; left: 520px; top: 520px; width: 560px; height: 560px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Center illustration of a hand-drawn glass jar with thick dark green outline (#2B4E43). The jar body is white with a few interior accent strokes (#2B4E43). The metal lid is a flattened oval top in warm amber (#F0BD63) with dark green rim lines. Inside the jar are four puffy hearts with a sticker-like white border: two red hearts (#D4433F) and two golden hearts (#F4C069) arranged diagonally. Beneath the jar sits a wide elliptical shadow/placemat in muted sage green (#8EA993) with a darker rim (#6E8C78), centered under the jar and overlapping the top of the white panel slightly." /><div style="position: absolute; left: 140px; top: 1060px; width: 1320px; height: 420px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <pattern id="polkaDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="white"/>
      <circle cx="15" cy="15" r="2" fill="white"/>
    </pattern>
  </defs>

  <!-- Step 1 Numeral -->
  <path d="M 150 100 L 190 105 L 185 250 L 145 245 Z"
        fill="url(#polkaDots)"
        stroke="#2B4E43"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Step 2 Numeral -->
  <path d="M 150 300 C 250 280 270 340 250 380 C 230 420 150 420 150 450 L 270 450 L 270 480 L 150 480 Z"
        fill="url(#polkaDots)"
        stroke="#2B4E43"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Step 3 Numeral -->
  <path d="M 700 100 C 800 80 820 140 800 180 C 780 220 700 220 700 250 C 800 250 820 280 800 320 C 780 360 700 360 700 320 Z"
        fill="url(#polkaDots)"
        stroke="#2B4E43"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Underline for Step 3 -->
  <path d="M 320 500 C 420 520 520 480 680 500"
        fill="none"
        stroke="#8EA993"
        stroke-width="25"
        stroke-linecap="round"/>
</svg></div><div style="position: absolute; left: 330px; top: 1070px; width: 520px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Get an empty jar</div></div><div style="position: absolute; left: 330px; top: 1200px; width: 520px; height: 180px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Write down your favorite self-care ideas on strips of paper.</div></div><div style="position: absolute; left: 1020px; top: 1070px; width: 480px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Whenever you're feeling down, stressed out, or drained – pull out a strip of paper and then do that activity.</div></div>
    </div>
</body>
</html>
