<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #DBE7D1;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 0px; width: 1600px; height: 1600px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1" preserveAspectRatio="none">
  <defs>
    <pattern id="gridPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <!-- Horizontal line -->
      <line x1="0" y1="0" x2="160" y2="0" stroke="#C9D7C1" stroke-width="2"/>
      <!-- Vertical line -->
      <line x1="0" y1="0" x2="0" y2="160" stroke="#C9D7C1" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- Background color -->
  <rect width="100%" height="100%" fill="#DBE7D1"/>
  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
</svg></div><div style="position: absolute; left: 200px; top: 140px; width: 1200px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Arial Rounded MT Bold; font-size: 120px; color: #2B4E43; text-align: center; font-weight: bold; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Self-Care Jar</div></div><div style="position: absolute; left: 120px; top: 200px; width: 1360px; height: 320px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 310">
  <g stroke="#FFFFFF" stroke-width="6" fill="none">
    <!-- Open-outline heart, ~200x240px, tilted 10° clockwise -->
    <path d="M 250 20 C 330 20 350 100 350 140 C 350 180 250 260 250 260 C 250 260 150 180 150 140 C 150 100 170 20 250 20 Z"
          transform="rotate(10 250 140)" stroke-linejoin="round"/>

    <!-- Three short accent dashes, radiating slightly upward -->
    <line x1="50" y1="120" x2="80" y2="110" stroke-linecap="round"/>
    <line x1="50" y1="140" x2="80" y2="130" stroke-linecap="round"/>
    <line x1="50" y1="160" x2="80" y2="150" stroke-linecap="round"/>
  </g>
</svg></div><div style="position: absolute; left: 96px; top: 1040px; width: 1408px; height: 480px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="100" rx="24" ry="24" fill="#FFFFFF" />
</svg></div><img src="asset-1.png" style="position: absolute; left: 520px; top: 520px; width: 560px; height: 560px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Center illustration of a hand-drawn glass jar with thick dark green outline (#2B4E43). The jar body is white with a few interior accent strokes (#2B4E43). The metal lid is a flattened oval top in warm amber (#F0BD63) with dark green rim lines. Inside the jar are four puffy hearts with a sticker-like white border: two red hearts (#D4433F) and two golden hearts (#F4C069) arranged diagonally. Beneath the jar sits a wide elliptical shadow/placemat in muted sage green (#8EA993) with a darker rim (#6E8C78), centered under the jar and overlapping the top of the white panel slightly." /><div style="position: absolute; left: 140px; top: 1060px; width: 1320px; height: 420px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="polkaDotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#A9C7A7"/>
      <circle cx="5" cy="5" r="2" fill="white"/>
      <circle cx="15" cy="15" r="2" fill="white"/>
      <circle cx="5" cy="15" r="2" fill="white"/>
      <circle cx="15" cy="5" r="2" fill="white"/>
    </pattern>
  </defs>

  <!-- Decorative Step Numerals -->
  <text x="100" y="200" font-family="cursive, sans-serif" font-size="180" font-weight="bold"
        fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round">1</text>

  <text x="100" y="450" font-family="cursive, sans-serif" font-size="180" font-weight="bold"
        fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round">2</text>

  <text x="600" y="200" font-family="cursive, sans-serif" font-size="180" font-weight="bold"
        fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round">3</text>

  <!-- Underline for Step 3 -->
  <path d="M 500 280 Q 700 295 860 275" fill="none" stroke="#8EA993" stroke-width="18" stroke-linecap="round"/>
</svg></div><div style="position: absolute; left: 330px; top: 1070px; width: 520px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Get an empty jar</div></div><div style="position: absolute; left: 330px; top: 1200px; width: 520px; height: 180px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Write down your favorite self-care ideas on strips of paper.</div></div><div style="position: absolute; left: 1020px; top: 1070px; width: 480px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Whenever you're feeling down, stressed out, or drained – pull out a strip of paper and then do that activity.</div></div>
    </div>
</body>
</html>
