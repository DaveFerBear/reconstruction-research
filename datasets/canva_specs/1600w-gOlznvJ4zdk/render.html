<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #DBE7D1;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 0px; width: 1600px; height: 1600px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <pattern id="gridPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="160" y2="1" stroke="#C9D7C1" stroke-width="2"/>
      <line x1="1" y1="0" x2="1" y2="160" stroke="#C9D7C1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#DBE7D1"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
</svg></div><div style="position: absolute; left: 200px; top: 140px; width: 1200px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Arial Rounded MT Bold; font-size: 120px; color: #2B4E43; text-align: center; font-weight: bold; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Self-Care Jar</div></div><div style="position: absolute; left: 120px; top: 200px; width: 1360px; height: 320px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 450 300" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#FFFFFF" stroke-width="6">
    <path fill="none" transform="translate(200 30) rotate(10 100 120)"
          d="M 100 0 C 20 0, 0 80, 0 120 C 0 160, 50 240, 100 240 C 150 240, 200 160, 200 120 C 200 80, 180 0, 100 0"/>
    <line x1="100" y1="150" x2="130" y2="145" stroke-linecap="round"/>
    <line x1="100" y1="150" x2="120" y2="120" stroke-linecap="round"/>
    <line x1="100" y1="150" x2="110" y2="100" stroke-linecap="round"/>
  </g>
</svg></div><div style="position: absolute; left: 96px; top: 1040px; width: 1408px; height: 480px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect x="0" y="0" width="600" height="300" rx="24" ry="24" fill="#FFFFFF"/>
</svg></div><img src="asset-1.png" style="position: absolute; left: 520px; top: 520px; width: 560px; height: 560px; transform: rotate(0deg); opacity: 1; object-fit: fill; " alt="Center illustration of a hand-drawn glass jar with thick dark green outline (#2B4E43). The jar body is white with a few interior accent strokes (#2B4E43). The metal lid is a flattened oval top in warm amber (#F0BD63) with dark green rim lines. Inside the jar are four puffy hearts with a sticker-like white border: two red hearts (#D4433F) and two golden hearts (#F4C069) arranged diagonally. Beneath the jar sits a wide elliptical shadow/placemat in muted sage green (#8EA993) with a darker rim (#6E8C78), centered under the jar and overlapping the top of the white panel slightly." /><div style="position: absolute; left: 140px; top: 1060px; width: 1320px; height: 420px; transform: rotate(0deg); opacity: 1; "><svg width="100%" height="100%" viewBox="0 0 750 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Polka dot pattern: small white circles on a #A9C7A7 background -->
    <pattern id="polkaDotPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" fill="#A9C7A7"/>
      <circle cx="5" cy="5" r="1.5" fill="white"/>
    </pattern>
  </defs>

  <!-- Numeral 1: Left column top -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">1</text>

  <!-- Numeral 2: Below Numeral 1 -->
  <text x="80" y="380" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">2</text>

  <!-- Numeral 3: Right column top -->
  <text x="480" y="180" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="url(#polkaDotPattern)" stroke="#2B4E43" stroke-width="8">3</text>

  <!-- Brush-like underline sweep under Step 3 (below Numeral 3) -->
  <path d="M430 280 Q600 310 770 280" stroke="#8EA993" stroke-width="30" stroke-linecap="round" fill="none"/>
</svg></div><div style="position: absolute; left: 330px; top: 1070px; width: 520px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Get an empty jar</div></div><div style="position: absolute; left: 330px; top: 1200px; width: 520px; height: 180px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Write down your favorite self-care ideas on strips of paper.</div></div><div style="position: absolute; left: 1020px; top: 1070px; width: 480px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Comic Sans MS; font-size: 38px; color: #2B4E43; text-align: left; font-weight: normal; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-start; "><div style="width: 100%;">Whenever you're feeling down, stressed out, or drained – pull out a strip of paper and then do that activity.</div></div>
    </div>
</body>
</html>
