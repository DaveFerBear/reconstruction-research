<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terracotta color for easel parts -->
  <defs>
    <style>
      .terracotta { fill: #c95f3b; }
      .pale-pink { fill: #efb0a6; }
      .background-color { fill: #f7dcb8; }
    </style>
  </defs>

  <!-- Easel Legs (behind the board) -->
  <rect x="30" y="30" width="8" height="60" rx="4" transform="rotate(-5 34 90)" class="terracotta"/>
  <rect x="62" y="30" width="8" height="60" rx="4" transform="rotate(5 66 90)" class="terracotta"/>

  <!-- Easel Center Support (behind the board) -->
  <rect x="48" y="10" width="4" height="70" class="terracotta"/>

  <!-- Pale Pink Poster/Board (main canvas) -->
  <rect x="25" y="15" width="50" height="60" class="pale-pink"/>

  <!-- Horizontal Shelf Bar (in front of the board) -->
  <rect x="23" y="73" width="54" height="4" rx="2" class="terracotta"/>

  <!-- Horizontal Top Clamp Bar (in front of the board) -->
  <rect x="23" y="13" width="54" height="4" rx="2" class="terracotta"/>

  <!-- Rounded Triangular Head Piece (in front, above clamp) -->
  <path d="M 40 13 A 5 5 0 0 1 50 8 A 5 5 0 0 1 60 13 Z" class="terracotta"/>

  <!-- Circular Hole in Head Piece (shows background color) -->
  <circle cx="50" cy="10.5" r="2.5" class="background-color"/>
</svg>