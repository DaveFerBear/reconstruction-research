<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sign Panel (blush-pink rounded rectangle, sits behind the easel) -->
  <rect x="30" y="30" width="40" height="40" rx="5" ry="5" fill="#F3BBB1"/>

  <!-- Easel Elements (terracotta-orange) -->
  <g fill="#C95E3E">
    <!-- Central Vertical Post -->
    <rect x="47" y="10" width="6" height="70" rx="2" ry="2"/>

    <!-- Top Shelf -->
    <rect x="40" y="25" width="20" height="4" rx="1" ry="1"/>

    <!-- Bottom Shelf -->
    <rect x="35" y="60" width="30" height="4" rx="1" ry="1"/>

    <!-- Triangular Head with Circular Cut-out -->
    <!-- The path combines the outer triangle and inner circle using fill-rule="evenodd" for the cut-out -->
    <path d="M 45 10 L 55 10 L 50 0 Z M 50 3 A 2 2 0 1 0 50 7 A 2 2 0 1 0 50 3 Z" fill-rule="evenodd"/>

    <!-- Left Splayed Leg with Softly Rounded End -->
    <path d="M 47 30 L 40 30 L 30 85 Q 35 92 40 85 L 47 30 Z"/>

    <!-- Right Splayed Leg with Softly Rounded End -->
    <path d="M 53 30 L 60 30 L 70 85 Q 65 92 60 85 L 53 30 Z"/>
  </g>
</svg>