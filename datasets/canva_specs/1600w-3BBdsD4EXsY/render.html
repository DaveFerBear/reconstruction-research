<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #f7dcb8;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 360px; top: 240px; width: 880px; height: 1120px; transform: rotate(0deg); opacity: 1; "><svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terracotta color for easel parts -->
  <defs>
    <style>
      .terracotta { fill: #c95f3b; }
      .pale-pink { fill: #efb0a6; }
      .background-color { fill: #f7dcb8; }
    </style>
  </defs>

  <!-- Easel Legs (behind the board) -->
  <rect x="30" y="30" width="8" height="60" rx="4" transform="rotate(-5 34 90)" class="terracotta"/>
  <rect x="62" y="30" width="8" height="60" rx="4" transform="rotate(5 66 90)" class="terracotta"/>

  <!-- Easel Center Support (behind the board) -->
  <rect x="48" y="10" width="4" height="70" class="terracotta"/>

  <!-- Pale Pink Poster/Board (main canvas) -->
  <rect x="25" y="15" width="50" height="60" class="pale-pink"/>

  <!-- Horizontal Shelf Bar (in front of the board) -->
  <rect x="23" y="73" width="54" height="4" rx="2" class="terracotta"/>

  <!-- Horizontal Top Clamp Bar (in front of the board) -->
  <rect x="23" y="13" width="54" height="4" rx="2" class="terracotta"/>

  <!-- Rounded Triangular Head Piece (in front, above clamp) -->
  <path d="M 40 13 A 5 5 0 0 1 50 8 A 5 5 0 0 1 60 13 Z" class="terracotta"/>

  <!-- Circular Hole in Head Piece (shows background color) -->
  <circle cx="50" cy="10.5" r="2.5" class="background-color"/>
</svg></div><div style="position: absolute; left: 420px; top: 620px; width: 760px; height: 260px; transform: rotate(0deg); opacity: 1; font-family: Arial Rounded MT Bold; font-size: 56px; color: #4b2c26; text-align: center; font-weight: bold; font-style: normal; text-decoration: none; text-transform: uppercase; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">DO THINGS AT YOUR
OWN PACE. LIFE'S NOT
A RACE.</div></div>
    </div>
</body>
</html>
