<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .headline-text {
      font-family: "Arial Black", "Impact", sans-serif;
      font-weight: 900;
      font-size: 150px;
      fill: #F33CAB;
      stroke: #FFD24F;
      stroke-width: 22px;
