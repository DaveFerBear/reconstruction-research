<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#667BDC" stroke-width="1.5"/>
    </pattern>
    <symbol id="starburst" viewBox="-50 -50 100 100">
      <path d="M 0 -50 L 10 -20 L 35 -35 L 20 -10 L 50 0 L 20 10 L 35 35 L 10 20 L 0 50 L -10 20 L -35 35 L -20 10 L -50 0 L -20 -10 L -35 -35 L -10 -20 Z"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#D8D8FF"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#grid)"/>

  <!-- Starbursts -->
  <use href="#starburst" fill="white" transform="translate(1000, 150) scale(0.5)"/> <!-- Top-right, 50px -->
  <use href="#starburst" fill="white" transform="translate(200, 400) scale(0.9)"/>  <!-- Left-center, 90px -->
  <use href="#starburst" fill="white" transform="translate(900, 500) scale(0.28)"/> <!-- Mid-right, 28px -->
  <use href="#starburst" fill="white" transform="translate(300, 700) scale(0.7)"/>  <!-- Lower-left, 70px -->
  <use href="#starburst" fill="white" transform="translate(600, 250) scale(0.4)"/>  <!-- Mid-top, 40px -->
  <use href="#starburst" fill="white" transform="translate(1100, 650) scale(0.6)"/> <!-- Lower-right, 60px -->
</svg>