<svg viewBox="0 0 350 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Blocky offset drop-shadows (dark-blue, shifted 24px down-right) -->
  <text x="20" y="60" fill="#284ACB" transform="translate(24 24)" font-family="Impact, sans-serif" font-size="60">BLOCKY</text>
  <text x="20" y="130" fill="#284ACB" transform="translate(24 24)" font-family="Impact, sans-serif" font-size="60">SHADOW</text>
  <text x="20" y="200" fill="#284ACB" transform="translate(24 24)" font-family="Impact, sans-serif" font-size="60">EFFECT</text>

  <!-- Headline words (white, on top for contrast) -->
  <text x="20" y="60" fill="white" font-family="Impact, sans-serif" font-size="60">BLOCKY</text>
  <text x="20" y="130" fill="white" font-family="Impact, sans-serif" font-size="60">SHADOW</text>
  <text x="20" y="200" fill="white" font-family="Impact, sans-serif" font-size="60">EFFECT</text>
</svg>