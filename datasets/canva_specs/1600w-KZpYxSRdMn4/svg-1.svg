<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7D26A" />
      <stop offset="100%" stop-color="#C8973A" />
    </linearGradient>
  </defs>

  <!-- Deep green wave (backmost) -->
  <path fill="#005000" d="M 0,250 L 0,200 C 200,100 400,220 600,160 C 800,100 900,180 1000,120 L 1000,250 Z" />

  <!-- Mid green wave -->
  <path fill="#3CB371" d="M 0,250 L 0,180 C 200,80 400,200 600,140 C 800,80 900,160 1000,100 L 1000,250 Z" />

  <!-- Metallic gold wave (frontmost) -->
  <path fill="url(#goldGradient)" d="M 0,250 L 0,160 C 200,60 400,180 600,120 C 800,60 900,140 1000,80 L 1000,250 Z" />
</svg>