<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7D26A"/>
      <stop offset="100%" stop-color="#C8973A"/>
    </linearGradient>
  </defs>

  <!-- Backmost deep green wave -->
  <path fill="#0A6A5B" d="M 0 300 C 200 290, 600 220, 1000 250 L 1000 300 Z"/>

  <!-- Mid green wave -->
  <path fill="#4CAF50" d="M 0 300 C 200 270, 600 180, 1000 210 L 1000 300 Z"/>

  <!-- Metallic gold wave -->
  <path fill="url(#goldGradient)" d="M 0 300 C 200 230, 600 140, 1000 170 L 1000 300 Z"/>
</svg>