<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Thin circular outline -->
  <circle cx="12" cy="12" r="10" stroke="#0F6B53" stroke-width="1.5"/>

  <!-- Globe base -->
  <circle cx="12" cy="12" r="6" fill="#0F6B53"/>

  <!-- Globe lines (latitude and longitude) -->
  <!-- Equator (slightly curved arc) -->
  <path d="M 6 12 A 6 6 0 0 1 18 12" stroke="white" stroke-width="0.75"/>
  <!-- Prime Meridian (vertical arc) -->
  <path d="M 12 6 A 6 6 0 0 1 12 18" stroke="white" stroke-width="0.75"/>
  <!-- Other meridians (curved lines) -->
  <path d="M 12 6 C 9 9, 9 15, 12 18" stroke="white" stroke-width="0.75"/>
  <path d="M 12 6 C 15 9, 15 15, 12 18" stroke="white" stroke-width="0.75"/>
</svg>