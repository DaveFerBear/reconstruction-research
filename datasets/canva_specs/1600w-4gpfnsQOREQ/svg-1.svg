<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="20"/>
      <feGaussianBlur stdDeviation="20"/>
      <feFlood flood-color="black" flood-opacity="0.12"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="50" y="50" width="400" height="500" rx="36" fill="#ffffff" filter="url(#soft-shadow)"/>

  <line x1="50" y1="410" x2="450" y2="410" stroke="#edd6d6" stroke-width="1"/>

  <line x1="250" y1="410" x2="250" y2="550" stroke="#edd6d6" stroke-width="1"/>
</svg>