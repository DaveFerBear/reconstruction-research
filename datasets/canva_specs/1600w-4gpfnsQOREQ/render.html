<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-color: #f6cbd6;
            overflow: hidden;
        }
    </style>
</head>

    <div id="canvas">

  <defs>

    </filter>
  </defs>

  <!-- White rounded-rectangle dialog card -->
  <rect x="70" y="40" width="360" height="480" rx="36" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Thin horizontal divider line -->
  <line x1="70" y1="400" x2="430" y2="400" stroke="#edd6d6" stroke-width="1"/>

</svg></div><div style="position: absolute; left: 160px; top: 1000px; width: 1280px; height: 90px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 64px; color: #4f5f6c; text-align: center; font-weight: 700; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">REMINDER</div></div><div style="position: absolute; left: 160px; top: 1098px; width: 1280px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 44px; color: #6e7d89; text-align: center; font-weight: 400; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Your productivity doesn’t define you.</div></div><div style="position: absolute; left: 160px; top: 1330px; width: 640px; height: 90px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 44px; color: #4f5f6c; text-align: center; font-weight: 500; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Yes</div></div><div style="position: absolute; left: 800px; top: 1330px; width: 640px; height: 90px; transform: rotate(0deg); opacity: 1; font-family: Helvetica; font-size: 44px; color: #4f5f6c; text-align: center; font-weight: 500; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">No</div></div>
