<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outlined Button -->
  <rect x="10" y="40" width="50" height="20" fill="#eee" stroke="#555" stroke-width="2"/>

  <!-- Cursor Outline (dark) -->
  <polygon
    points="0,0 -10,15 -6,15 -20,30 -15,25 0,10"
    fill="#333"
    transform="translate(58, 48)"
  />

  <!-- Cursor Fill (white) -->
  <polygon
    points="1,1 -9,14 -6,14 -19,29 -16,26 1,11"
    fill="white"
    transform="translate(58, 48)"
  />
</svg>