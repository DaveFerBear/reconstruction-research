<svg width="300" height="60" viewBox="0 0 300 60">
  <!-- Main pill-shaped background -->
  <rect x="0" y="0" width="300" height="60" rx="20" ry="20" fill="#2A1742" fill-opacity="0.9"/>

  <!-- Dividers -->
  <line x1="100" y1="10" x2="100" y2="50" stroke="#6e5c8d" stroke-width="1"/>
  <line x1="200" y1="10" x2="200" y2="50" stroke="#6e5c8d" stroke-width="1"/>

  <!-- Left Section: Phone Icon and Text -->
  <g fill="white" font-family="sans-serif" font-size="14" dominant-baseline="middle">
    <!-- Phone Handset Icon (simple rotated rounded rectangle) -->
    <!-- Path for a 15x6 rounded rectangle, rotated -45 degrees around its center (7.5, 3) -->
    <path d="M 0 0 H 15 A 3 3 0 0 1 15 6 H 0 A 3 3 0 0 1 0 0 Z"
          transform="translate(30 27) rotate(-45 7.5 3)" />
    <text x="55" y="30" text-anchor="start">Call</text>
  </g>

  <!-- Middle Section: Text -->
  <text x="150" y="30" fill="white" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Home</text>

  <!-- Right Section: Text -->
  <text x="250" y="30" fill="white" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Settings</text>
</svg>