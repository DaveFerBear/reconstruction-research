<svg viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="SourceAlpha" in2="offsetBlur" operator="arithmetic" k2="-1" k3="1" result="shadowMap"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15" result="floodColor"/>
      <feComposite in="floodColor" in2="shadowMap" operator="in"/>
    </filter>
  </defs>

  <!-- Main info bar -->
  <rect x="0" y="0" width="1200" height="80" rx="22" ry="22" fill="#2b1848" fill-opacity="0.85" filter="url(#innerShadow)"/>

  <!-- Separator lines -->
  <line x1="640" y1="10" x2="640" y2="70" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="990" y1="10" x2="990" y2="70" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Phone icon background circle -->
  <circle cx="49" cy="40" r="27" fill="#3a2a60"/>

  <!-- Simplified white phone handset glyph -->
  <path d="M 38 29 C 37 29 36 30 36 31 L 36 49 C 36 50 37 51 38 51 L 60 51 C 61 51 62 50 62 49 L 62 31 C 62 30 61 29 60 29 L 38 29 Z" fill="white" transform="rotate(-15 49 40)"/>
</svg>