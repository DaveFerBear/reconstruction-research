  <path class="cobalt" d="M50 18 C70 22 72 40 72 50 C72 60 70 78 50 82 C30 78 28 60 28 50 C28 40 30 22 50 18 Z"/>

  <!-- Inner ring of dots -->
  <circle class="cobalt" cx="50" cy="25" r="1.5"/>
