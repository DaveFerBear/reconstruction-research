<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Plate elements -->
  <g id="plate">
    <!-- Main plate fill -->
    <ellipse cx="300" cy="300" rx="250" ry="180" fill="white" />

    <!-- Double-line border -->
    <ellipse cx="300" cy="300" rx="250" ry="180" fill="none" stroke="#1f3f93" stroke-width="2" />
    <ellipse cx="300" cy="300" rx="245" ry="175" fill="none" stroke="#1f3f93" stroke-width="1.5" />

    <!-- Inner ring of evenly spaced dots -->
    <g fill="#1f3f93">
      <circle cx="300" cy="150" r="2" />
      <circle cx="350" cy="160" r="2" />
      <circle cx="390" cy="185" r="2" />
      <circle cx="420" cy="220" r="2" />
      <circle cx="440" cy="260" r="2" />
      <circle cx="450" cy="300" r="2" />
      <circle cx="440" cy="340" r="2" />
      <circle cx="420" cy="380" r="2" />
      <circle cx="390" cy="415" r="2" />
      <circle cx="350" cy="440" r="2" />
      <circle cx="300" cy="450" r="2" />
      <circle cx="250" cy="440" r="2" />
      <circle cx="210" cy="415" r="2" />
      <circle cx="180" cy="380" r="2" />
      <circle cx="160" cy="340" r="2" />
      <circle cx="150" cy="300" r="2" />
      <circle cx="160" cy="260" r="2" />
      <circle cx="180" cy="220" r="2" />
      <circle cx="210" cy="185" r="2" />
      <circle cx="250" cy="160" r="2" />
    </g>
  </g>

  <!-- Lobster illustration -->
  <g id="lobster" stroke="#1f3f93" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Body -->
    <path d="M300 200 C270 220 270 300 300 320 C330 300 330 220 300 200 Z" />

    <!-- Head -->
    <path d="M300 200 Q290 170 295 150 Q305 150 310 170 Q300 200" />

    <!-- Tail segments -->
    <path d="M300 320 C285 340 285 360 300 380 C315 360 315 340 300 320 Z" />
    <path d="M300 380 C290 395 290 410 300 420 C310 410 310 395 300 380 Z" />
    <path d="M300 420 C295 430 295 440 300 445 C305 440 305 430 300 420 Z" />
    <!-- Tail fan -->
    <path d="M300 445 L285 460 M300 445 L315 460 M285 460 L275 465 M315 460 L325 465" />

    <!-- Claws (raised) -->
    <path d="M290 220 C250 180 220 180 200 210 C190 230 200 250 220 240 M200 210 L180 200" />
    <path d="M310 220 C350 180 380 180 400 210 C410 230 400 250 380 240 M400 210 L420 200" />

    <!-- Antennae -->
    <path d="M295 150 Q270 100 250 120" stroke-width="2" />
    <path d="M305 150 Q330 100 350 120" stroke-width="2" />

    <!-- Eyes -->
    <circle cx="295" cy="160" r="2" fill="#1f3f93" stroke="none" />
    <circle cx="305" cy="160" r="2" fill="#1f3f93" stroke="none" />

    <!-- Legs -->
    <path d="M280 250 L260 260 M320 250 L340 260" stroke-width="1.5" />
    <path d="M280 280 L260 290 M320 280 L340 290" stroke-width="1.5" />
    <path d="M280 310 L260 320 M320 310 L340 320" stroke-width="1.5" />
  </g>

  <!-- White highlight streaks -->
  <g id="highlights" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- Plate highlights -->
    <path d="M400 190 Q450 250 440 300" />
    <path d="M200 190 Q150 250 160 300" />
    <path d="M300 150 Q320 130 350 140" />

    <!-- Lobster shell highlights -->
    <path d="M305 270 Q320 290 315 310" />
    <path d="M295 270 Q280 290 285 310" />
    <path d="M220 220 Q210 210 200 215" />
    <path d="M380 220 Q390 210 400 215" />
    <path d="M300 390 Q310 400 305 410" />
  </g>
</svg>