  <circle class="cobalt" cx="67" cy="40" r="1.5"/>
  <circle class="cobalt" cx="70" cy="50" r="1.5"/>
  <circle class="cobalt" cx="67" cy="60" r="1.5"/>
  <circle class="cobalt" cx="60" cy="70" r="1.5"/>
  <circle class="cobalt" cx="50" cy="75" r="1.5"/>
