  <path class="cobalt" d="M45 52 Q40 57 35 52" stroke="#1f3f9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path class="cobalt" d="M45 54 Q40 59 35 54" stroke="#1f3f9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path class="cobalt" d="M55 50 Q60 55 65 50" stroke="#1f3f9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path class="cobalt" d="M55 52 Q60 57 65 52" stroke="#1f3f9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path class="cobalt" d="M55 54 Q60 59 65 54" stroke="#1f3f9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

