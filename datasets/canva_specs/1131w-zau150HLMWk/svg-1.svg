  <path class="cobalt" d="M50 72 C52 74 52 76 50 78 C48 76 48 74 50 72 Z"/>
  <!-- Tail fin/fluke -->
  <path class="cobalt" d="M50 78 C55 77 58 80 58 83 C58 86 55 89 50 88 C45 89 42 86 42 83 C42 80 45 77 50 78 Z"/>

