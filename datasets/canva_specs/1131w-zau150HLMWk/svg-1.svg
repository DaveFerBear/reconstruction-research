<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cobalt { fill: #1f3f9a; }
      .highlight { fill: white; }
    </style>
  </defs>

  <!-- Platter -->
  <!-- Outer blue shape (effectively the background of the outer outline) -->
  <path class="cobalt" d="M50 8 C80 15 85 40 85 50 C85 60 80 85 50 92 C20 85 15 60 15 50 C15 40 20 15 50 8 Z"/>
  <!-- Inner white shape to create the outer blue ring -->
  <path class="highlight" d="M50 12 C75 18 78 40 78 50 C78 60 75 82 50 88 C25 82 22 60 22 50 C22 40 25 18 50 12 Z"/>
