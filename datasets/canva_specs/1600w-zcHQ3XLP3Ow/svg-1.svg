<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a24480" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2d3e4c" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="panelFilter" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Subtle inner-background blur effect (applied to the panel itself for a frosted look) -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blurredPanel"/>
      <!-- Faint outer drop shadow (applied to the blurred panel) -->
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="black" flood-opacity="0.24" in="blurredPanel"/>
    </filter>
  </defs>

  <rect
    x="110"
    y="80"
    width="500"
    height="300"
    rx="38"
    ry="38"
    fill="url(#panelGradient)"
    stroke="#ffffff26"
    stroke-width="1"
    filter="url(#panelFilter)"
  />
</svg>