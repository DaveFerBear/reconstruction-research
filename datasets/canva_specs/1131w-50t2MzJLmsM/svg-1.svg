<svg viewBox="0 0 100 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <rect id="long-dash" width="10" height="3" rx="1.5" ry="1.5" fill="#007bff" />
    <rect id="short-dash" width="5" height="3" rx="1.5" ry="1.5" fill="#007bff" />
  </defs>

  <!-- First row of dashes, positioned at y=5 -->
  <g transform="translate(0 5)">
    <use href="#long-dash" x="7.5" />
    <use href="#short-dash" x="22.5" />
    <use href="#long-dash" x="32.5" />
    <use href="#short-dash" x="47.5" />
    <use href="#long-dash" x="57.5" />
    <use href="#short-dash" x="72.5" />
    <use href="#long-dash" x="82.5" />
  </g>

  <!-- Second row of dashes, positioned at y=20 -->
  <g transform="translate(0 20)">
    <use href="#long-dash" x="7.5" />
    <use href="#short-dash" x="22.5" />
    <use href="#long-dash" x="32.5" />
    <use href="#short-dash" x="47.5" />
    <use href="#long-dash" x="57.5" />
    <use href="#short-dash" x="72.5" />
    <use href="#long-dash" x="82.5" />
  </g>
</svg>