<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1131px;
            height: 1600px;
            background-image: url('background.png'); background-size: cover; background-position: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 70px; top: 360px; width: 991px; height: 1120px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="sketchyTexture" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Clip paths for hatching stars -->
        <clipPath id="starClip1">
            <polygon points="100,360 110,390 140,390 115,410 125,440 100,420 75,440 85,410 60,390 90,390" />
        </clipPath>
        <clipPath id="starClip2">
            <polygon points="250,460 260,490 290,490 265,510 275,540 250,520 225,540 235,510 210,490 240,490" />
        </clipPath>
    </defs>

    <g stroke="#243EB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#sketchyTexture)">

        <!-- Coffee Cup Scene (Upper-Right) -->
        <ellipse cx="650" cy="350" rx="120" ry="60" /> <!-- Tray -->
        <ellipse cx="650" cy="320" rx="60" ry="20" /> <!-- Saucer -->
        <!-- Cup body: bottom ellipse, then lines up, then top ellipse -->
        <path d="M 620 315 A 30 15 0 1 0 680 315 L 680 285 A 30 15 0 1 0 620 285 Z" />
        <!-- Cup handle -->
        <path d="M 680 295 C 695 285, 695 305, 680 315" />
        <!-- Steam -->
        <path d="M 640 270 C 630 260, 640 250, 650 240" />
        <path d="M 660 270 C 670 260, 660 250, 650 240" />

        <!-- Female Server (Lower-Right) -->
        <circle cx="650" cy="450" r="25" /> <!-- Head -->
        <circle cx="665" cy="445" r="10" /> <!-- Bun -->
        <line x1="650" y1="475" x2="650" y2="485" /> <!-- Neck -->
        <path d="M 640 485 L 630 510 L 670 510 L 660 485 Z" /> <!-- Torso -->
        <path d="M 635 510 L 630 540 L 670 540 L 665 510 Z" /> <!-- Apron -->
        <path d="M 655 485 C 670 400, 680 360, 680 350" /> <!-- Arm holding tray -->
        <line x1="635" y1="540" x2="635" y2="570" /> <!-- Left Leg -->
        <line x1="665" y1="540" x2="665" y2="570" /> <!-- Right Leg -->
        <path d="M 625 570 L 625 585 L 645 585 L 645 570 Z" /> <!-- Left Boot -->
        <path d="M 655 570 L 655 585 L 675 585 L 675 570 Z" /> <!-- Right Boot -->

        <!-- Stars (Left Half) -->

        <!-- One large outlined star -->
        <polygon points="150,70 170,130 230,130 180,170 200,230 150,190 100,230 120,170 70,130 130,130" />

        <!-- Two smaller filled-with-hatching stars -->
        <!-- Star 1: Outline -->
        <polygon points="100,360 110,390 140,390 115,410 125,440 100,420 75,440 85,410 60,390 90,390" />
        <!-- Star 1: Hatching -->
        <g clip-path="url(#starClip1)">
            <line x1="80" y1="350" x2="120" y2="450" />
            <line x1="70" y1="360" x2="110" y2="460" />
            <line x1="90" y1="340" x2="130" y2="440" />
            <line x1="75" y1="370" x2="115" y2="470" />
            <line x1="85" y1="330" x2="125" y2="430" />
        </g>
        <!-- Star 2: Outline -->
        <polygon points="250,460 260,490 290,490 265,510 275,540 250,520 225,540 235,510 210,490 240,490" />
        <!-- Star 2: Hatching -->
        <g clip-path="url(#starClip2)">
            <line x1="230" y1="450" x2="270" y2="550" />
            <line x1="220" y1="460" x2="260" y2="560" />
            <line x1="240" y1="440" x2="280" y2="540" />
            <line x1="235" y1="470" x2="275" y2="570" />
            <line x1="245" y1="430" x2="285" y2="530" />
        </g>

        <!-- Two medium stars with sketchy linework -->
        <!-- Star 1 -->
        <g>
            <polygon points="200,190 215,235 260,235 225,265 240,310 200,280 160,310 175,265 130,235 170,235" />
            <polygon points="201,191 216,236 261,236 226,266 241,311 201,281 161,311 176,266 131,236 171,236" />
            <polygon points="199,189 214,234 259,234 224,264 239,309 199,279 159,309 174,264 129,234 169,234" />
        </g>
        <!-- Star 2 -->
        <g>
            <polygon points="350,40 365,85 410,85 375,115 390,160 350,130 310,160 325,115 280,85 320,85" />
            <polygon points="351,41 366,86 411,86 376,116 391,161 351,131 311,161 326,116 281,86 321,86" />
            <polygon points="349,39 364,84 409,84 374,114 389,159 349,129 309,159 324,114 279,84 319,84" />
        </g>

    </g>

    </div>
</body>
</html>
