<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Path for a 1x1 rounded diamond star, centered at (0.5, 0.5).
      This shape represents a "diamond cross with rounded points" in a clean, minimal way.
      It's a square rotated 45 degrees with rounded corners.
      The quadratic Bezier curves (Q) create the rounded points.
    -->
    <path id="starPath" fill-rule="evenodd" clip-rule="evenodd" d="M0.5 0 Q0.875 0.125 1 0.5 Q0.875 0.875 0.5 1 Q0.125 0.875 0 0.5 Q0.125 0.125 0.5 0Z"/>
  </defs>

  <!-- Large star: ~34x34px, positioned above-left of a conceptual text block area (e.g., 100,100 to 300,200) -->
  <!-- Placed at (56, 56) within the 400x400 viewBox. -->
  <g transform="translate(56 56) scale(34)">
    <use href="#starPath" fill="#ffffff"/>
  </g>

  <!-- Small star 1: ~22x22px, positioned lower-right of the conceptual text block -->
  <!-- Placed at (310, 210) within the 400x400 viewBox. -->
  <g transform="translate(310 210) scale(22)">
    <use href="#starPath" fill="#ffffff"/>
  </g>

  <!-- Small star 2: ~16x16px, positioned lower-right of the conceptual text block, ~60px below Small star 1 -->
  <!-- Placed at (310, 292) within the 400x400 viewBox (210 + 22px_height_of_star1 + 60px_spacing = 292). -->
  <g transform="translate(310 292) scale(16)">
    <use href="#starPath" fill="#ffffff"/>
  </g>
</svg>