<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Single thin, translucent white elliptical stroke, tilted 15 degrees counterclockwise -->
  <ellipse cx="200" cy="100" rx="180" ry="80" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4" transform="rotate(-15 200 100)" />

  <!-- Sparkle star definition -->
  <defs>
    <path id="sparkle" fill="white" d="M0,-5 L1,-2 L5,0 L2,1 L0,5 L-1,2 L-5,0 L-2,-1 Z" />
  </defs>

  <!-- Three small four-point sparkle stars -->
  <!-- One above-left of the first line (assuming text starts around 50, 70) -->
  <use href="#sparkle" x="40" y="60" transform="scale(0.8)" />
  <!-- One small sparkle just below-right of the ellipse center -->
  <use href="#sparkle" x="220" y="120" transform="scale(0.6)" />
  <!-- One larger sparkle below-right near the end of the second line (assuming text ends around 350, 130) -->
  <use href="#sparkle" x="360" y="140" transform="scale(1.0)" />
</svg>