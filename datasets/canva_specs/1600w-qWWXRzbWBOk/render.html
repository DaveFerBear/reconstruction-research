<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-image: url('background.png'); background-size: cover; background-position: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 420px; top: 520px; width: 760px; height: 380px; transform: rotate(0deg); opacity: 1; "><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <ellipse
    cx="450"
    cy="250"
    rx="380"
    ry="190"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-opacity="0.45"
    transform="rotate(12 450 250)" />
</svg></div><div style="position: absolute; left: 200px; top: 590px; width: 1200px; height: 200px; transform: rotate(0deg); opacity: 1; font-family: Georgia; font-size: 150px; color: #ffffff; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Every day is</div></div><div style="position: absolute; left: 200px; top: 760px; width: 1200px; height: 180px; transform: rotate(0deg); opacity: 1; font-family: Georgia; font-size: 130px; color: #ffffff; text-align: center; font-weight: 400; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">a new chance</div></div><div style="position: absolute; left: 520px; top: 460px; width: 560px; height: 520px; transform: rotate(0deg); opacity: 1; "><svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Path for a 1x1 rounded diamond star, centered at (0.5, 0.5).
      This shape represents a "diamond cross with rounded points" in a clean, minimal way.
      It's a square rotated 45 degrees with rounded corners.
      The quadratic Bezier curves (Q) create the rounded points.
    -->
    <path id="starPath" fill-rule="evenodd" clip-rule="evenodd" d="M0.5 0 Q0.875 0.125 1 0.5 Q0.875 0.875 0.5 1 Q0.125 0.875 0 0.5 Q0.125 0.125 0.5 0Z"/>
  </defs>

  <!-- Large star: ~34x34px, positioned above-left of a conceptual text block area (e.g., 100,100 to 300,200) -->
  <!-- Placed at (56, 56) within the 400x400 viewBox. -->
  <g transform="translate(56 56) scale(34)">
    <use href="#starPath" fill="#ffffff"/>
  </g>

  <!-- Small star 1: ~22x22px, positioned lower-right of the conceptual text block -->
  <!-- Placed at (310, 210) within the 400x400 viewBox. -->
  <g transform="translate(310 210) scale(22)">
    <use href="#starPath" fill="#ffffff"/>
  </g>

  <!-- Small star 2: ~16x16px, positioned lower-right of the conceptual text block, ~60px below Small star 1 -->
  <!-- Placed at (310, 292) within the 400x400 viewBox (210 + 22px_height_of_star1 + 60px_spacing = 292). -->
  <g transform="translate(310 292) scale(16)">
    <use href="#starPath" fill="#ffffff"/>
  </g>
</svg></div>
    </div>
</body>
</html>
