<!DOCTYPE html>
<html>
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;

            background-image: url('background.png'); background-size: cover; background-position: center;
            overflow: hidden;
        }

</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 360px; top: 460px; width: 880px; height: 560px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="sparkle" viewBox="-5 -5 10 10">

    </symbol>

  <!-- Single thin, translucent white elliptical stroke -->
  <ellipse

    fill="none"
    stroke="white"
    stroke-width="1.5"
    opacity="0.5"
    transform="rotate(-15 200 100)"

  <use href="#sparkle" transform="translate(30 60) scale(0.8)" fill="white" />
