<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80">
  <defs>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feComposite in="SourceAlpha" in2="offsetBlur" operator="arithmetic" k2="-1" k3="1" result="shadowMap"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowMap" operator="in" result="innerShadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="350" height="80" rx="40" ry="40" fill="#ff4b5f" filter="url(#innerShadow)"/>

  <text x="175" y="40" font-family="sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    LIVE STREAMING
  </text>
</svg>