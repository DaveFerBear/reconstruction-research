  <defs>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Blur the alpha channel of the source graphic -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <!-- Offset the blurred alpha slightly -->
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <!-- Create the inner shadow mask: subtract original alpha from offset blurred alpha -->
      <feComposite in="SourceAlpha" in2="offsetBlur" operator="arithmetic" k2="-1" k3="1" result="shadowAlpha"/>
      <!-- Flood with shadow color (dark gray with opacity) -->
      <feFlood flood-color="#000000" flood-opacity="0.3" result="shadowColor"/>
      <!-- Apply shadow color to the shadow alpha mask -->
      <feComposite in="shadowColor" in2="shadowAlpha" operator="in" result="shadow"/>
      <!-- Merge the shadow with the original graphic -->
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
