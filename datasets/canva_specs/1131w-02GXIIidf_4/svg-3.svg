<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grungeFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g transform="rotate(-5 100 50)">
    <!-- Main stamp shape -->
    <rect x="20" y="10" width="160" height="80" rx="10" ry="10" fill="#e31e24" filter="url(#grungeFilter)" />

    <!-- Inner border line -->
    <rect x="25" y="15" width="150" height="70" rx="8" ry="8" fill="none" stroke="white" stroke-width="2" filter="url(#grungeFilter)" />

    <!-- Text 'REWARD' -->
    <text x="100" y="50" text-anchor="middle" dominant-baseline="central" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">REWARD</text>
  </g>
</svg>