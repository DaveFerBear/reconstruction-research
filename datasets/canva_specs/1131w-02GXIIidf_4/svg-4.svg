<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="roughEdges" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="0" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g transform="rotate(5 70 72.5)">
    <!-- Main stamp rectangle with rough edges -->
    <rect x="50" y="60" width="40" height="25" fill="#D02020" filter="url(#roughEdges)"/>
    <!-- Scratch marks -->
    <path d="M55 65 L58 64 L60 65.5" stroke="#A01010" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
    <path d="M62 70 L65 69 L67 70.5" stroke="#A01010" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M75 62 L77 61 L79 62.5" stroke="#A01010" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
    <path d="M80 75 L83 74 L85 75.5" stroke="#A01010" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
    <path d="M68 63 L71 62 L73 63.5" stroke="#A01010" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>