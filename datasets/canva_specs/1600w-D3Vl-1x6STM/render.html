<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1131px;
            background-color: #f5efdc;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <div style="position: absolute; left: 0px; top: 0px; width: 1600px; height: 1131px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100" height="100" fill="#f5efdc"/>
  <defs>
    <!--
      Defines a single ray shape:
      - Starts at the origin (0,0), which will be the center of rotation.
      - Moves to an inner point (20,5).
      - Draws a line to an outer point (100,15).
      - Creates a quadratic bezier curve (Q) to another outer point (100,-15),
        using (110,0) as the control point to create an outward curve.
      - Draws a line to an inner point (20,-5).
      - Closes the path back to the origin (0,0).
    -->
    <path id="retro-ray" d="M 0 0 L 20 5 L 100 15 Q 110 0 100 -15 L 20 -5 Z"/>
  </defs>

  <!--
    Each ray uses the defined path and applies a transform:
    - scale(1 0.7): Squashes the ray vertically to create an oval perspective.
    - rotate(angle): Rotates the ray around its origin (0,0).
    - translate(50 50): Moves the ray's origin to the center of the viewBox (50,50).
    The transforms are applied in order: scale, then rotate, then translate.
  -->
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(0) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(30) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(60) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(90) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(120) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(150) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(180) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(210) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(240) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(270) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(300) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(330) scale(1 0.7)"/>
</svg></div><div style="position: absolute; left: 120px; top: 80px; width: 1360px; height: 970px; transform: rotate(0deg); opacity: 1; "><svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter for the exaggerated heavier shadowed stroke on the ellipse -->
    <filter id="ellipse-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- dx and dy negative/positive for lower-left offset, stdDeviation for blur/heaviness -->
      <feDropShadow dx="-10" dy="10" stdDeviation="8" flood-color="#1f1f1f" />
    </filter>

    <!-- Path for a lightning bolt (base shape) -->
    <path id="lightning-bolt-shape" d="M 0 0 L 15 30 L 5 30 L 20 60 L 10 60 L 25 90"
          stroke-linejoin="miter" stroke-linecap="round"/>

    <!-- Path for a four-point diamond starburst (base shape) -->
    <path id="starburst-shape" d="M 0 -20 L 20 0 L 0 20 L -20 0 Z"
          stroke-linejoin="miter" stroke-linecap="round"/>
  </defs>

  <!-- Large central white ellipse panel with thick black outline and exaggerated heavier shadowed stroke -->
  <ellipse cx="400" cy="300" rx="250" ry="150"
           fill="white"
           stroke="#1f1f1f"
           stroke-width="5"
           filter="url(#ellipse-shadow)" />

  <!-- Decorative Elements -->

  <!-- Lightning Bolt 1 (Top-right, leaning slightly right) -->
  <!-- Shadow (brick red, offset slightly) -->
  <use href="#lightning-bolt-shape"
       fill="#c95646"
       transform="translate(550, 150) rotate(10) translate(3, 3)" />
  <!-- Main Bolt (white with black outline) -->
  <use href="#lightning-bolt-shape"
       fill="white"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(550, 150) rotate(10)" />

  <!-- Lightning Bolt 2 (Bottom-left, leaning slightly left) -->
  <!-- Shadow (brick red, offset slightly) -->
  <use href="#lightning-bolt-shape"
       fill="#c95646"
       transform="translate(200, 400) rotate(-10) translate(3, 3)" />
  <!-- Main Bolt (white with black outline) -->
  <use href="#lightning-bolt-shape"
       fill="white"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(200, 400) rotate(-10)" />

  <!-- Starburst 1 (Upper-left, partly tucked into the ellipse) -->
  <use href="#starburst-shape"
       fill="#E74C3C" <!-- A distinct red for starbursts -->
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(250, 180)" />

  <!-- Starburst 2 (Lower-right edge) -->
  <use href="#starburst-shape"
       fill="#E74C3C"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(580, 420)" />

</svg></div><div style="position: absolute; left: 170px; top: 190px; width: 1260px; height: 60px; transform: rotate(0deg); opacity: 1; font-family: Georgia; font-size: 38px; color: #2f7f7a; text-align: center; font-weight: 700; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Larana, Inc.</div></div><div style="position: absolute; left: 170px; top: 300px; width: 1260px; height: 110px; transform: rotate(0deg); opacity: 1; font-family: Arial Black; font-size: 84px; color: #c95646; text-align: center; font-weight: 900; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">28.09.2028</div></div><div style="position: absolute; left: 170px; top: 410px; width: 1260px; height: 220px; transform: rotate(0deg); opacity: 1; font-family: Arial Black; font-size: 160px; color: #2f7f7a; text-align: center; font-weight: 900; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">COMING SOON</div></div><div style="position: absolute; left: 170px; top: 620px; width: 1260px; height: 140px; transform: rotate(0deg); opacity: 1; font-family: Arial Black; font-size: 110px; color: #c95646; text-align: center; font-weight: 900; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">-STAY TUNED-</div></div><div style="position: absolute; left: 170px; top: 740px; width: 1260px; height: 80px; transform: rotate(0deg); opacity: 1; font-family: Arial Black; font-size: 54px; color: #2f7f7a; text-align: center; font-weight: 900; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">www.reallygreatsite.com</div></div>
    </div>
</body>
</html>
