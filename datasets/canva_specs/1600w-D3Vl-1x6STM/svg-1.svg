<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100" height="100" fill="#f5efdc"/>
  <defs>
    <!--
      Defines a single ray shape:
      - Starts at the origin (0,0), which will be the center of rotation.
      - Moves to an inner point (20,5).
      - Draws a line to an outer point (100,15).
      - Creates a quadratic bezier curve (Q) to another outer point (100,-15),
        using (110,0) as the control point to create an outward curve.
      - Draws a line to an inner point (20,-5).
      - Closes the path back to the origin (0,0).
    -->
    <path id="retro-ray" d="M 0 0 L 20 5 L 100 15 Q 110 0 100 -15 L 20 -5 Z"/>
  </defs>

  <!--
    Each ray uses the defined path and applies a transform:
    - scale(1 0.7): Squashes the ray vertically to create an oval perspective.
    - rotate(angle): Rotates the ray around its origin (0,0).
    - translate(50 50): Moves the ray's origin to the center of the viewBox (50,50).
    The transforms are applied in order: scale, then rotate, then translate.
  -->
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(0) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(30) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(60) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(90) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(120) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(150) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(180) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(210) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(240) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(270) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#3a8f8c" transform="translate(50 50) rotate(300) scale(1 0.7)"/>
  <use href="#retro-ray" fill="#c95646" transform="translate(50 50) rotate(330) scale(1 0.7)"/>
</svg>