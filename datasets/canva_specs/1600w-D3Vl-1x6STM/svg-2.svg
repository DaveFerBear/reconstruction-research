<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter for the exaggerated heavier shadowed stroke on the ellipse -->
    <filter id="ellipse-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- dx and dy negative/positive for lower-left offset, stdDeviation for blur/heaviness -->
      <feDropShadow dx="-10" dy="10" stdDeviation="8" flood-color="#1f1f1f" />
    </filter>

    <!-- Path for a lightning bolt (base shape) -->
    <path id="lightning-bolt-shape" d="M 0 0 L 15 30 L 5 30 L 20 60 L 10 60 L 25 90"
          stroke-linejoin="miter" stroke-linecap="round"/>

    <!-- Path for a four-point diamond starburst (base shape) -->
    <path id="starburst-shape" d="M 0 -20 L 20 0 L 0 20 L -20 0 Z"
          stroke-linejoin="miter" stroke-linecap="round"/>
  </defs>

  <!-- Large central white ellipse panel with thick black outline and exaggerated heavier shadowed stroke -->
  <ellipse cx="400" cy="300" rx="250" ry="150"
           fill="white"
           stroke="#1f1f1f"
           stroke-width="5"
           filter="url(#ellipse-shadow)" />

  <!-- Decorative Elements -->

  <!-- Lightning Bolt 1 (Top-right, leaning slightly right) -->
  <!-- Shadow (brick red, offset slightly) -->
  <use href="#lightning-bolt-shape"
       fill="#c95646"
       transform="translate(550, 150) rotate(10) translate(3, 3)" />
  <!-- Main Bolt (white with black outline) -->
  <use href="#lightning-bolt-shape"
       fill="white"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(550, 150) rotate(10)" />

  <!-- Lightning Bolt 2 (Bottom-left, leaning slightly left) -->
  <!-- Shadow (brick red, offset slightly) -->
  <use href="#lightning-bolt-shape"
       fill="#c95646"
       transform="translate(200, 400) rotate(-10) translate(3, 3)" />
  <!-- Main Bolt (white with black outline) -->
  <use href="#lightning-bolt-shape"
       fill="white"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(200, 400) rotate(-10)" />

  <!-- Starburst 1 (Upper-left, partly tucked into the ellipse) -->
  <use href="#starburst-shape"
       fill="#E74C3C" <!-- A distinct red for starbursts -->
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(250, 180)" />

  <!-- Starburst 2 (Lower-right edge) -->
  <use href="#starburst-shape"
       fill="#E74C3C"
       stroke="#1f1f1f"
       stroke-width="2"
       transform="translate(580, 420)" />

</svg>