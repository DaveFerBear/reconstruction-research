<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1f1f1f" stroke-width="2">
    <!-- Main Frame (outer edge at 0,0, inner edge at 2,2) -->
    <rect x="1" y="1" width="398" height="298" fill="none"/>
    <!-- Inner Horizontal Divider (top band height 60px, from inner top edge) -->
    <line x1="2" y1="62" x2="398" y2="62"/>
    <!-- Inner Vertical Divider (splits bottom section, from inner horizontal divider to inner bottom edge) -->
    <line x1="200" y1="62" x2="200" y2="298"/>
    <!-- Top Band Left Horizontal Rule (aligned with inner left edge) -->
    <line x1="2" y1="32" x2="119" y2="32"/>
    <!-- Top Band Right Horizontal Rule (aligned with inner right edge) -->
    <line x1="279" y1="32" x2="398" y2="32"/>
  </g>
  <!-- Color Swatches (centered vertically in top band, no stroke) -->
  <rect x="129" y="22" width="20" height="20" fill="#f7d1c3"/>
  <rect x="159" y="22" width="20" height="20" fill="#f7b2c0"/>
  <rect x="189" y="22" width="20" height="20" fill="#f38aa3"/>
  <rect x="219" y="22" width="20" height="20" fill="#e66a84"/>
  <rect x="249" y="22" width="20" height="20" fill="#b21f3e"/>
</svg>