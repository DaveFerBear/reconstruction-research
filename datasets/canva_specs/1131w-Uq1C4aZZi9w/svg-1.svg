<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Large bordered information panel -->
  <rect x="0" y="0" width="400" height="300" stroke="#1b1a1b" stroke-width="2" fill="#fff"/>

  <!-- Thin horizontal rule near the top -->
  <line x1="11" y1="31" x2="389" y2="31" stroke="#1b1a1b" stroke-width="1"/>

  <!-- Another thin horizontal rule below the first rule -->
  <line x1="11" y1="61" x2="389" y2="61" stroke="#1b1a1b" stroke-width="1"/>

  <!-- Centered swatch bar made of six adjacent small rectangles -->
  <rect x="110" y="36" width="30" height="20" fill="#f6d7c9"/>
  <rect x="140" y="36" width="30" height="20" fill="#f7c3c7"/>
  <rect x="170" y="36" width="30" height="20" fill="#f7a9bb"/>
  <rect x="200" y="36" width="30" height="20" fill="#f38ea8"/>
  <rect x="230" y="36" width="30" height="20" fill="#e06a8b"/>
  <rect x="260" y="36" width="30" height="20" fill="#b01f3b"/>

  <!-- Long horizontal divider splits upper paragraph area from lower two-column area -->
  <line x1="11" y1="150" x2="389" y2="150" stroke="#1b1a1b" stroke-width="1"/>

  <!-- In the lower section, a single vertical line divides the left and right columns -->
  <line x1="200" y1="160" x2="200" y2="289" stroke="#1b1a1b" stroke-width="1"/>
</svg>