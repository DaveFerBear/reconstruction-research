<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1f1f1f" stroke-width="2" fill="none">
    <!-- Main Frame -->
    <rect x="0" y="0" width="300" height="200"/>

    <!-- Inner Horizontal Divider (creating top band of 40px height) -->
    <line x1="0" y1="40" x2="300" y2="40"/>

    <!-- Inner Vertical Divider (splitting bottom section from y=40 to y=200) -->
    <line x1="150" y1="40" x2="150" y2="200"/>

    <!-- Top Band: Left short horizontal rule -->
    <line x1="10" y1="20" x2="30" y2="20"/>
    <!-- Top Band: Right short horizontal rule -->
    <line x1="270" y1="20" x2="290" y2="20"/>
  </g>

  <!-- Top Band: Five small color swatches -->
  <rect x="102.5" y="12.5" width="15" height="15" fill="#f7d1c3"/>
  <rect x="122.5" y="12.5" width="15" height="15" fill="#f7b2c0"/>
  <rect x="142.5" y="12.5" width="15" height="15" fill="#f38aa3"/>
  <rect x="162.5" y="12.5" width="15" height="15" fill="#e66a84"/>
  <rect x="182.5" y="12.5" width="15" height="15" fill="#b21f3e"/>
</svg>