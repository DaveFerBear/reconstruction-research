<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="distressFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g transform="rotate(-5 100 50)" filter="url(#distressFilter)">
    <!-- Main stamp body -->
    <rect x="20" y="20" width="160" height="60" rx="10" ry="10" fill="#e31e24"/>

    <!-- Inner border line -->
    <rect x="25" y="25" width="150" height="50" rx="8" ry="8" fill="none" stroke="white" stroke-width="2"/>

    <!-- Text -->
    <text x="100" y="50" text-anchor="middle" dominant-baseline="middle"
          font-family="sans-serif" font-size="24" font-weight="bold" fill="white">
      REWARD
    </text>
  </g>
</svg>