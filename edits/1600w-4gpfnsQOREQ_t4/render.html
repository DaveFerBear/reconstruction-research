<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            position: relative;
            width: 1600px;
            height: 1600px;
            background-image: url('background.png'); background-size: cover; background-position: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas">
        <img src="asset-1.png" style="position: absolute; left: 310px; top: 120px; width: 980px; height: 1460px; transform: rotate(0deg); opacity: 1.0; object-fit: fill; " alt="Photorealistic front view of a modern black smartphone (iPhone-style) centered on the canvas. It has a slim black bezel, rounded corners, and a wide top notch with a small camera/earpiece opening. The screen content is white, and the device casts a soft shadow on the pink background." /><div style="position: absolute; left: 730px; top: 330px; width: 140px; height: 110px; transform: rotate(0deg); opacity: 1.0; "><svg viewBox="0 0 24 24" fill="none" stroke="#3f5361" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="4" width="20" height="16" />
  <path d="M2 4 L12 12 L22 4 Z" />
  <path d="M19.5 2 L19.5 4 C19.5 4.5 20 5 20.5 5 C21 5 21.5 4.5 21.5 4 L21.5 2" />
  <circle cx="20.5" cy="1" r="0.5" />
</svg></div><div style="position: absolute; left: 83px; top: 729px; width: 1434px; height: 582px; transform: rotate(0deg); opacity: 1.0; "><svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modal card body with rounded corners and drop shadow -->
  <rect x="70" y="70" width="500" height="300" rx="44" ry="44" fill="white" filter="url(#drop-shadow)"/>

  <!-- Thin horizontal divider line in pale pink -->
  <line x1="70" y1="310" x2="570" y2="310" stroke="#efd9dc" stroke-width="1"/>

  <!-- Thin vertical divider line in pale pink, splitting the bottom area -->
  <line x1="320" y1="310" x2="320" y2="370" stroke="#efd9dc" stroke-width="1"/>
</svg></div><div style="position: absolute; left: 83px; top: 796px; width: 1434px; height: 80px; transform: rotate(0deg); opacity: 1.0; font-family: Helvetica; font-size: 56px; color: #3f5361; text-align: center; font-weight: 700; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">REMINDER</div></div><div style="position: absolute; left: 83px; top: 886px; width: 1434px; height: 130px; transform: rotate(0deg); opacity: 1.0; font-family: Helvetica; font-size: 38px; color: #6d7b86; text-align: center; font-weight: 400; font-style: italic; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Your productivity doesn’t define you.</div></div><div style="position: absolute; left: 83px; top: 1110px; width: 717px; height: 120px; transform: rotate(0deg); opacity: 1.0; font-family: Helvetica; font-size: 44px; color: #3f5361; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">Yes</div></div><div style="position: absolute; left: 800px; top: 1110px; width: 717px; height: 120px; transform: rotate(0deg); opacity: 1.0; font-family: Helvetica; font-size: 44px; color: #3f5361; text-align: center; font-weight: 400; font-style: normal; text-decoration: none; text-transform: none; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; "><div style="width: 100%;">No</div></div>
    </div>
</body>
</html>
