<svg viewBox="0 0 100 100">
  <defs>
    <filter id="watercolorWash">
      <!-- Create fractal noise for a textured base -->
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" seed="0" result="noise"/>
      <!-- Convert the noise to grayscale -->
      <feColorMatrix in="noise" type="saturate" values="0" result="grayscaleNoise"/>
      <!-- Map grayscale values to the alpha channel to create a transparency mask -->
      <feComponentTransfer in="grayscaleNoise" result="alphaMask">
        <feFuncA type="linear" slope="0.5" intercept="0.2"/>
      </feComponentTransfer>
      <!-- Blur the alpha mask slightly for softer, more organic edges -->
      <feGaussianBlur in="alphaMask" stdDeviation="1" result="blurredAlphaMask"/>
      <!-- Apply the blurred alpha mask to the source graphic (the rectangle) -->
      <feComposite in="SourceGraphic" in2="blurredAlphaMask" operator="in"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#1A4B7D" filter="url(#watercolorWash)"/>
</svg>