<svg viewBox="0 0 100 100">
  <defs>
    <filter id="watercolorWash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="3" seed="0" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayscaleNoise"/>
      <feComponentTransfer in="grayscaleNoise" result="alphaMask">
        <feFuncA type="linear" slope="0.8" intercept="0.1"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="alphaMask" operator="in"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#0077B6" filter="url(#watercolorWash)"/>
</svg>