<svg viewBox="0 0 100 100">
  <defs>
    <filter id="watercolorWash" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" seed="0" result="textureNoise" />
      <feDisplacementMap in="SourceGraphic" in2="textureNoise" scale="3" xChannelSelector="R" yChannelSelector="G" result="distortedGraphic" />
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="2" seed="1" result="alphaNoise" />
      <feComponentTransfer in="alphaNoise" result="alphaMask">
        <feFuncA type="linear" slope="0.8" intercept="0.1" />
      </feComponentTransfer>
      <feComposite in="distortedGraphic" in2="alphaMask" operator="in" result="alphaWashed" />
      <feGaussianBlur in="alphaWashed" stdDeviation="0.5" />
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#0A4F6B" filter="url(#watercolorWash)" />
</svg>