<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define a single snowflake shape (a 6-pointed star) -->
    <path id="snowflake" fill="white" d="M 0,-10 L 2,-2 L 10,0 L 2,2 L 0,10 L -2,2 L -10,0 L -2,-2 Z"/>
  </defs>

  <!-- Place snowflakes to form a corner border in the top-left -->
  <!-- The 'transform' attribute combines translation (position) and scaling (size) -->
  <use href="#snowflake" transform="translate(15,15) scale(0.7)"/>
  <use href="#snowflake" transform="translate(35,15) scale(0.7)"/>
  <use href="#snowflake" transform="translate(55,15) scale(0.7)"/>
  <use href="#snowflake" transform="translate(15,35) scale(0.7)"/>
  <use href="#snowflake" transform="translate(15,55) scale(0.7)"/>
</svg>